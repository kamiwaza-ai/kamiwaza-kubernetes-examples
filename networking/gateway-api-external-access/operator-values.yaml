manager:
  watchNamespaces:
    - kw-gateway-access
  watchAnyNamespace: false
adminPolicy:
  revision: kw-gateway-access-r1
  allowedTargetNamespaces:
    - kw-gateway-access
  storage:
    allowedClassNames:
      - example-rwo
      - absent-class
    allowedSharedClassNames: []
  routing:
    gateway:
      name: kamiwaza-gateway
      namespace: kw-gateway-access
      sectionName: https
  trust:
    managementPolicy: CertManager
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-ca
    certificate:
      duration: 8760h
      renewBefore: 720h
      privateKey:
        algorithm: ECDSA
        size: 384
        encoding: PKCS8
        rotationPolicy: Always
    bundle:
      configMapName: kamiwaza-trust-bundle
      sourceSecretName: core-client-tls
      sourceKey: ca.crt
  images:
    requireDigests: true
    allowedRepositoryPrefixes:
      - ghcr.io/kamiwaza-internal/
      - ghcr.io/authzed/
      - ghcr.io/agentgateway/
    pullSecretNames:
      - registry-pull
  modelRegistry:
    type: OCIRegistry
    endpoint: registry.kw-gateway-access.svc.cluster.local:5000
    credentialSecretName: kamiwaza-registry-credentials
    usernameKey: username
    passwordKey: password
  metadataCatalog:
    provider: DataHub
  observability:
    allowedModes: [Disabled]
    approvedSinks: []
    monitoring:
      enabled: false
      provider: PrometheusOperator
  operations:
    adoptionAllowed: false
    deleteAllAllowed: false
    genericSecretRotationAllowed: false
    approvedForwardOnlyUpgradeTargets:
      - 1.3.0
  extensions:
    enabled: true
    allowedNamespaces:
      - kw-gateway-access
    allowNamespaceCreation: false
    allowCrossNamespaceResources: false
    hostDiscovery: Disabled
    sandbox: Disabled
    dynamicRBAC: Disabled
  dependencies:
    certManager:
      managementPolicy: External
      versionConstraint: ">=1.20.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: cert-manager
    trustManager:
      managementPolicy: External
      versionConstraint: ">=0.22.0 <1.0.0"
      evidenceSource: AdminAttested
      namespace: kw-gateway-access
    routing:
      managementPolicy: External
      versionConstraint: ">=1.28.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-gateway-access
    gatewayAPI:
      managementPolicy: External
      versionConstraint: ">=1.4.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-gateway-access
  domains:
    allocationMode: ExplicitAllowlist
    allowedDomains:
      - gateway-access.example.invalid
    allowedSuffixes: []
