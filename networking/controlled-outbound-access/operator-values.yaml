manager:
  watchNamespaces:
    - kw-controlled-egress
  watchAnyNamespace: false
adminPolicy:
  revision: kw-controlled-egress-r1
  allowedTargetNamespaces:
    - kw-controlled-egress
  storage:
    allowedClassNames:
      - example-rwo
      - absent-class
    allowedSharedClassNames: []
  routing:
    gateway:
      name: kamiwaza-gateway
      namespace: kw-controlled-egress
      sectionName: https
  trust:
    managementPolicy: CertManager
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-ca
    certificate:
      duration: 8760h
      renewBefore: 720h
      privateKey:
        algorithm: ECDSA
        size: 384
        encoding: PKCS8
        rotationPolicy: Always
    bundle:
      configMapName: kamiwaza-trust-bundle
      sourceSecretName: core-client-tls
      sourceKey: ca.crt
  images:
    requireDigests: true
    allowedRepositoryPrefixes:
      - ghcr.io/kamiwaza-internal/
      - ghcr.io/authzed/
      - ghcr.io/agentgateway/
      - docker.io/library/
    pullSecretNames:
      - registry-pull
  modelRegistry:
    type: OCIRegistry
    endpoint: registry.kw-controlled-egress.svc.cluster.local:5000
    credentialSecretName: kamiwaza-registry-credentials
    usernameKey: username
    passwordKey: password
  metadataCatalog:
    provider: DataHub
  observability:
    allowedModes:
      - Disabled
    approvedSinks: []
    monitoring:
      enabled: false
      provider: PrometheusOperator
  operations:
    adoptionAllowed: false
    deleteAllAllowed: false
    genericSecretRotationAllowed: false
    approvedForwardOnlyUpgradeTargets:
      - 1.3.0
  extensions:
    enabled: true
    allowedNamespaces:
      - kw-controlled-egress
    allowNamespaceCreation: false
    allowCrossNamespaceResources: false
    hostDiscovery: Disabled
    sandbox: Disabled
    dynamicRBAC: Disabled
  dependencies:
    certManager:
      managementPolicy: External
      versionConstraint: ">=1.20.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: cert-manager
    trustManager:
      managementPolicy: External
      versionConstraint: ">=0.22.0 <1.0.0"
      evidenceSource: AdminAttested
      namespace: kw-controlled-egress
    routing:
      managementPolicy: External
      versionConstraint: ">=1.28.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-controlled-egress
    gatewayAPI:
      managementPolicy: External
      versionConstraint: ">=1.4.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-controlled-egress
  domains:
    allocationMode: ExplicitAllowlist
    allowedDomains:
      - egress.example.invalid
    allowedSuffixes: []
  transport:
    issuance:
      mode: PlatformIssued
    trust:
      bundleConfigMapName: kamiwaza-trust-bundle
      targetNamespaces:
        - kw-controlled-egress
      publicRoots: Include
      maximumBundleBytes: 900000
      additionalAuthorities:
        - name: enterprise-root
          configMapRef:
            name: enterprise-trust
            key: root.pem
    floor:
      minimumTLSVersion: TLS1.2
      hostnameVerification: Required
    internal:
      defaultTransport: PlatformTLS
      workloadIngressFloor: true
    clientIdentities: []
    egress:
      deniedNetworks:
        - Loopback
        - LinkLocal
        - CloudMetadata
        - PrivateRanges
      destinations:
        - name: reviewed-echo
          kind: ExtensionExternalAPI
          hosts:
            - postman-echo.com
          ports:
            - 443
          transport: TLS
          authentication:
            type: None
          requiredAuthorities:
            - enterprise-root
          enforcementMode: EnforcingProxy
          proxyRef: corporate-egress
      proxies:
        - name: corporate-egress
          url: https://egress-proxy.egress-system.svc.cluster.local:3128
          authorityName: enterprise-root
          enforcesDestinationPolicy: true
          evidenceRef:
            name: proxy-conformance
            key: result.json
