manager:
  watchNamespaces:
    - kw-hosted-models
  watchAnyNamespace: false
adminPolicy:
  revision: kw-hosted-models-r1
  allowedTargetNamespaces:
    - kw-hosted-models
  storage:
    allowedClassNames:
      - example-rwo
      - absent-class
    allowedSharedClassNames: []
  routing:
    gateway:
      name: kamiwaza-gateway
      namespace: kw-hosted-models
      sectionName: https
  trust:
    managementPolicy: CertManager
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-ca
    certificate:
      duration: 8760h
      renewBefore: 720h
      privateKey:
        algorithm: ECDSA
        size: 384
        encoding: PKCS8
        rotationPolicy: Always
    bundle:
      configMapName: kamiwaza-trust-bundle
      sourceSecretName: core-client-tls
      sourceKey: ca.crt
  images:
    requireDigests: true
    allowedRepositoryPrefixes:
      - ghcr.io/kamiwaza-internal/
      - ghcr.io/authzed/
      - ghcr.io/agentgateway/
    pullSecretNames:
      - registry-pull
  modelRegistry:
    type: OCIRegistry
    endpoint: registry.kw-hosted-models.svc.cluster.local:5000
    credentialSecretName: kamiwaza-registry-credentials
    usernameKey: username
    passwordKey: password
  metadataCatalog:
    provider: DataHub
  observability:
    allowedModes: [Disabled]
    approvedSinks: []
    monitoring:
      enabled: false
      provider: PrometheusOperator
  operations:
    adoptionAllowed: false
    deleteAllAllowed: false
    genericSecretRotationAllowed: false
    approvedForwardOnlyUpgradeTargets:
      - 1.3.0
  extensions:
    enabled: true
    allowedNamespaces:
      - kw-hosted-models
    allowNamespaceCreation: false
    allowCrossNamespaceResources: false
    hostDiscovery: Disabled
    sandbox: Disabled
    dynamicRBAC: Disabled
  dependencies:
    certManager:
      managementPolicy: External
      versionConstraint: ">=1.20.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: cert-manager
    trustManager:
      managementPolicy: External
      versionConstraint: ">=0.22.0 <1.0.0"
      evidenceSource: AdminAttested
      namespace: kw-hosted-models
    routing:
      managementPolicy: External
      versionConstraint: ">=1.28.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-hosted-models
    gatewayAPI:
      managementPolicy: External
      versionConstraint: ">=1.4.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-hosted-models
  domains:
    allocationMode: ExplicitAllowlist
    allowedDomains:
      - hosted-models.example.invalid
    allowedSuffixes: []
  modelProviders:
    profiles:
      - name: bedrock
        type: AWSBedrock
        destinationClass: bedrock-api
        awsBedrock:
          region: us-east-1
      - name: azure-ai
        type: AzureAI
        destinationClass: azure-ai-api
        azureAI:
          endpointURL: https://replace.openai.azure.com
          deployment: gpt-4o
      - name: google-vertex
        type: GoogleVertex
        destinationClass: google-vertex-api
        googleVertex:
          project: replace-project
          location: us-central1
      - name: openrouter
        type: OpenRouter
        destinationClass: openrouter-api
      - name: openai-compatible
        type: OpenAICompatible
        destinationClass: openai-compatible-api
        openAICompatible:
          endpointURL: https://api.example.invalid/v1
  transport:
    issuance:
      mode: PlatformIssued
    trust:
      bundleConfigMapName: kamiwaza-trust-bundle
      targetNamespaces:
        - kw-hosted-models
      publicRoots: Include
      maximumBundleBytes: 900000
    floor:
      minimumTLSVersion: TLS1.2
      hostnameVerification: Required
    internal:
      defaultTransport: PlatformTLS
      workloadIngressFloor: true
    clientIdentities: []
    egress:
      deniedNetworks:
        - Loopback
        - LinkLocal
        - CloudMetadata
        - PrivateRanges
      destinations:
        - name: bedrock-api
          kind: ModelProvider
          hosts:
            - bedrock-runtime.us-east-1.amazonaws.com
          ports: [443]
          transport: TLS
          authentication: { type: None }
          enforcementMode: PolicyAwareDialer
        - name: azure-ai-api
          kind: ModelProvider
          hosts:
            - replace.openai.azure.com
          ports: [443]
          transport: TLS
          authentication: { type: None }
          enforcementMode: PolicyAwareDialer
        - name: google-vertex-api
          kind: ModelProvider
          hosts:
            - us-central1-aiplatform.googleapis.com
          ports: [443]
          transport: TLS
          authentication: { type: None }
          enforcementMode: PolicyAwareDialer
        - name: openrouter-api
          kind: ModelProvider
          hosts:
            - openrouter.ai
          ports: [443]
          transport: TLS
          authentication: { type: None }
          enforcementMode: PolicyAwareDialer
        - name: openai-compatible-api
          kind: ModelProvider
          hosts:
            - api.example.invalid
          ports: [443]
          transport: TLS
          authentication: { type: None }
          enforcementMode: PolicyAwareDialer
      proxies: []
