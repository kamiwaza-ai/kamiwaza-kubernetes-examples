apiVersion: v1
kind: Namespace
metadata:
  name: kw-hosted-models
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: serving.kamiwaza.io/v1alpha1
kind: ModelDeployment
metadata:
  name: hosted-model
  namespace: kw-hosted-models
spec:
  deploymentID: hosted-model
  modelID: openai/gpt-4o-mini
  state: Running
  external:
    providerProfileRef:
      name: openrouter
    credentialSecretRef:
      name: model-provider-openrouter
      key: credential
