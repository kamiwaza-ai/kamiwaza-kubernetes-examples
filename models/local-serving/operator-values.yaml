manager:
  watchNamespaces:
    - kw-local-models
  watchAnyNamespace: false
adminPolicy:
  revision: kw-local-models-r1
  allowedTargetNamespaces:
    - kw-local-models
  storage:
    allowedClassNames:
      - example-rwo
      - absent-class
    allowedSharedClassNames: []
  routing:
    gateway:
      name: kamiwaza-gateway
      namespace: kw-local-models
      sectionName: https
  trust:
    managementPolicy: CertManager
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-ca
    certificate:
      duration: 8760h
      renewBefore: 720h
      privateKey:
        algorithm: ECDSA
        size: 384
        encoding: PKCS8
        rotationPolicy: Always
    bundle:
      configMapName: kamiwaza-trust-bundle
      sourceSecretName: core-client-tls
      sourceKey: ca.crt
  images:
    requireDigests: true
    allowedRepositoryPrefixes:
      - ghcr.io/kamiwaza-internal/
      - ghcr.io/authzed/
      - ghcr.io/agentgateway/
      - ghcr.io/ggml-org/
    pullSecretNames:
      - registry-pull
  modelRegistry:
    type: OCIRegistry
    endpoint: registry.kw-local-models.svc.cluster.local:5000
    credentialSecretName: kamiwaza-registry-credentials
    usernameKey: username
    passwordKey: password
  metadataCatalog:
    provider: DataHub
  observability:
    allowedModes: [Disabled]
    approvedSinks: []
    monitoring:
      enabled: false
      provider: PrometheusOperator
  operations:
    adoptionAllowed: false
    deleteAllAllowed: false
    genericSecretRotationAllowed: false
    approvedForwardOnlyUpgradeTargets:
      - 1.3.0
  extensions:
    enabled: true
    allowedNamespaces:
      - kw-local-models
    allowNamespaceCreation: false
    allowCrossNamespaceResources: false
    hostDiscovery: Disabled
    sandbox: Disabled
    dynamicRBAC: Disabled
  dependencies:
    certManager:
      managementPolicy: External
      versionConstraint: ">=1.20.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: cert-manager
    trustManager:
      managementPolicy: External
      versionConstraint: ">=0.22.0 <1.0.0"
      evidenceSource: AdminAttested
      namespace: kw-local-models
    routing:
      managementPolicy: External
      versionConstraint: ">=1.28.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-local-models
    gatewayAPI:
      managementPolicy: External
      versionConstraint: ">=1.4.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-local-models
  domains:
    allocationMode: ExplicitAllowlist
    allowedDomains:
      - models.example.invalid
    allowedSuffixes: []
  modelServing:
    engines:
      - name: LlamaCpp
        profiles:
          - name: cpu
            image: ghcr.io/kamiwaza-internal/containers/images/llamacpp-cpu@sha256:2cca4d9b2eda3088fb6cb28f00fb60ea8f71abfd8c5b1179d55df26476e3aeeb
          - name: nvidia
            acceleratorResourceName: nvidia.com/gpu
            image: ghcr.io/ggml-org/llama.cpp@sha256:5268283a8d6510d167364f19aee93e98180d8eb0cac4b7edb20af7e3edf40c17
            offloadLayers: All
          - name: amd
            acceleratorResourceName: amd.com/gpu
            image: ghcr.io/ggml-org/llama.cpp@sha256:73e0930f80636792197a3faf95baf42a6e79d1aa9d600a0b3e8060de80a291e9
            offloadLayers: All
    artifactSources:
      - name: huggingface
        type: HuggingFace
        destinationClass: huggingface-models
  transport:
    issuance:
      mode: PlatformIssued
    trust:
      bundleConfigMapName: kamiwaza-trust-bundle
      targetNamespaces:
        - kw-local-models
      publicRoots: Include
      maximumBundleBytes: 900000
    floor:
      minimumTLSVersion: TLS1.2
      hostnameVerification: Required
    internal:
      defaultTransport: PlatformTLS
      workloadIngressFloor: true
    clientIdentities: []
    egress:
      deniedNetworks:
        - Loopback
        - LinkLocal
        - CloudMetadata
        - PrivateRanges
      destinations:
        - name: huggingface-models
          kind: ModelArtifactRegistry
          hosts:
            - huggingface.co
          ports: [443]
          transport: TLS
          authentication: { type: None }
          enforcementMode: PolicyAwareDialer
      proxies: []
