# =============================================================================
# Kamiwaza Debug — Namespace + RBAC
# -----------------------------------------------------------------------------
# Apply once per cluster. The ClusterRole is intentionally broad for SRE
# triage. It can read Secret data and open exec sessions in every namespace.
# An exec session can change workload state without a Kubernetes API mutation.
# Bind this role only to a short-lived, administrator-controlled identity.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: kamiwaza-debug
  labels:
    app.kubernetes.io/name: kamiwaza-debug
    app.kubernetes.io/part-of: kamiwaza-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
  namespace: kamiwaza-debug
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kamiwaza-debug
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kamiwaza-debug
  namespace: kamiwaza-debug
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kamiwaza-debug
  # ----- explicit, accepted RBAC exceptions -----
  # The wildcard read and scoped exec, log, and port-forward verbs form the
  # explicit SRE triage contract. Read access includes Secret contents.
  # Exec access can change workload state without a Kubernetes API mutation.
  # Bind this ClusterRole only to short-lived identities gated by your IdP.
  annotations:
    ignore-check.kube-linter.io/cluster-admin-role-binding: >-
      Not cluster-admin: wildcard read plus scoped exec, port-forward, attach,
      and log access. Workload resources have no create, update, patch, or
      delete verb.
    ignore-check.kube-linter.io/wildcard-in-rules: >-
      Wildcard verbs are limited to get, list, and watch. Exec, port-forward,
      attach, and log access are enumerated for audit.
rules:
  # Read everything — k9s, kubectl get, stern
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Logs + exec + port-forward
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec", "pods/portforward", "pods/attach"]
    verbs: ["get", "list", "create"]
  # Allow auth-checks like `kubectl auth can-i --as=…`
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kamiwaza-debug
subjects:
  - kind: ServiceAccount
    name: kamiwaza-debug
    namespace: kamiwaza-debug
roleRef:
  kind: ClusterRole
  name: kamiwaza-debug
  apiGroup: rbac.authorization.k8s.io
# NOTE: the namespace-scoped Role granting `pods:create / pods:delete`
# (required for `kubectl debug node --profile=sysadmin`) is intentionally
# NOT defined in this file. The Role lives in `node-debug-role.yaml`
# and its CEL ValidatingAdmissionPolicy guard lives in `node-debug-
# policy.yaml`. Splitting them across THREE files (this baseline +
# policy + role) is a deliberate security boundary:
#
#   * `kubectl apply -f file.yaml` is non-atomic per-resource, so any
#     single combined file risks a partial apply on a pre-1.30 cluster
#     (Role lands; policy fails on the unknown
#     admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy kind);
#     end state would be `pods:create` in a PSA-privileged namespace
#     with no CEL guard — the exact escalation primitive the policy
#     exists to close.
#   * Two files (policy first, role second) force the operator into two
#     separate `kubectl apply` invocations. A pre-1.30 apply of
#     `node-debug-policy.yaml` fails cleanly with no privilege uplift
#     (the policy file contains zero RBAC). Operators see the failure
#     and stop before applying `node-debug-role.yaml`.
#   * `make verify-rbac` enforces the same ordering automatically with
#     a server-version gate; GitOps consumers can mirror it via
#     argocd.argoproj.io/sync-wave (policy=0, role=1).
