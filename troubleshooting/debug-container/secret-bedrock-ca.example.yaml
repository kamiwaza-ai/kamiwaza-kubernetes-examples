# The customer's Bedrock proxy CA, mounted read-only by the jump pod at
# /etc/kamiwaza/bedrock/proxy-ca.pem.
#
# The data key MUST be `proxy-ca.pem` — the jump pod mounts this whole Secret
# at the directory /etc/kamiwaza/bedrock, so the file only lands at the path
# NODE_EXTRA_CA_CERTS expects if the key is named exactly that.
#
# Optional — only needed if the Bedrock proxy presents a private-CA TLS cert.
apiVersion: v1
kind: Secret
metadata:
  name: kamiwaza-debug-bedrock-ca
  namespace: kamiwaza-debug
type: Opaque
stringData:
  proxy-ca.pem: |
    -----BEGIN CERTIFICATE-----
    # paste the Bedrock proxy's CA certificate here
    -----END CERTIFICATE-----
