# Bedrock runtime config for the debug container's Claude Code.
#
# Copy this to a real Secret and fill in the values discovered by
# `bedrock_preflight.py` (ships in the kamiwaza platform repo under scripts/).
# Every key is OPTIONAL — the jump pod starts without this Secret; Claude Code
# is simply unconfigured until it exists. The jump pod pulls these keys
# explicitly (per-key secretKeyRef), so any extra keys here are ignored.
#
# There is NO Anthropic login: Bedrock mode (baked into the image) makes Claude
# Code sign requests to the customer's Bedrock proxy with an AWS credential.
apiVersion: v1
kind: Secret
metadata:
  name: kamiwaza-debug-bedrock
  namespace: kamiwaza-debug
type: Opaque
stringData:
  # --- endpoint + model ---
  AWS_REGION: "us-east-1"                                  # region the proxy/Bedrock serves
  ANTHROPIC_BEDROCK_BASE_URL: "https://bedrock-proxy.internal.example"  # the customer's Bedrock proxy URL
  ANTHROPIC_MODEL: "us.anthropic.claude-sonnet-4-6"        # a model id the proxy actually serves
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "us.anthropic.claude-sonnet-4-6"  # set EQUAL to ANTHROPIC_MODEL so Claude
                                                          # never reaches for a Haiku the proxy may not serve

  # --- auth: use bearer token OR IAM keys, not both ---
  AWS_BEARER_TOKEN_BEDROCK: ""                             # bearer mode (simplest)
  # AWS_ACCESS_KEY_ID: ""                                  # ...or IAM mode
  # AWS_SECRET_ACCESS_KEY: ""
  # AWS_SESSION_TOKEN: ""                                  # optional, for temporary IAM creds

  # --- avoid an IMDS hang on a pod with no instance role ---
  AWS_EC2_METADATA_DISABLED: "true"

  # --- proxy CA: must match the mount path from the jump pod (see
  #     secret-bedrock-ca.example.yaml). Only needed if the proxy presents a
  #     private-CA TLS cert. ---
  NODE_EXTRA_CA_CERTS: "/etc/kamiwaza/bedrock/proxy-ca.pem"
