adminPolicy:
  revision: federation-east-r1
  federation:
    maximumActiveLinks: 8
    profiles:
      - name: west
        remoteClusterID: west
        destinationClass: west-platform
        workloadIdentity:
          trustDomain: west.kamiwaza.example
          bundleEndpoint: https://identity.west.kamiwaza.example/bundle
          bundleDestinationClass: west-bundle
          endpointProfile: HttpsSpiffe
          acceptedIdentities:
            - spiffe://west.kamiwaza.example/ns/kw-federation-west/sa/kamiwaza-dataplane
          maximumBundleStaleness: 15m
        failurePolicy: FailClosed
  transport:
    egress:
      deniedNetworks:
        - Loopback
        - LinkLocal
        - CloudMetadata
        - PrivateRanges
      destinations:
        - name: west-bundle
          kind: PlatformInformation
          hosts:
            - identity.west.kamiwaza.example
          ports:
            - 443
          transport: TLS
          authentication:
            type: None
          enforcementMode: PolicyAwareDialer
        - name: west-platform
          kind: PlatformInformation
          hosts:
            - protocol.west.kamiwaza.example
          ports:
            - 443
          transport: MutualTLS
          authentication:
            type: WorkloadIdentityX509
            maxConnectionAge: 15m
            workloadIdentityX509:
              trustDomain: west.kamiwaza.example
              acceptedIdentities:
                - spiffe://west.kamiwaza.example/ns/kw-federation-west/sa/kamiwaza-dataplane
          enforcementMode: PolicyAwareDialer
