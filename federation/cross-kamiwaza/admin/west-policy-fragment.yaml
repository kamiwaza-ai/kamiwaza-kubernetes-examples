adminPolicy:
  revision: federation-west-r1
  federation:
    maximumActiveLinks: 8
    profiles:
      - name: east
        remoteClusterID: east
        destinationClass: east-platform
        workloadIdentity:
          trustDomain: east.kamiwaza.example
          bundleEndpoint: https://identity.east.kamiwaza.example/bundle
          bundleDestinationClass: east-bundle
          endpointProfile: HttpsSpiffe
          acceptedIdentities:
            - spiffe://east.kamiwaza.example/ns/kw-federation-east/sa/kamiwaza-dataplane
          maximumBundleStaleness: 15m
        failurePolicy: FailClosed
  transport:
    egress:
      deniedNetworks:
        - Loopback
        - LinkLocal
        - CloudMetadata
        - PrivateRanges
      destinations:
        - name: east-bundle
          kind: PlatformInformation
          hosts:
            - identity.east.kamiwaza.example
          ports:
            - 443
          transport: TLS
          authentication:
            type: None
          enforcementMode: PolicyAwareDialer
        - name: east-platform
          kind: PlatformInformation
          hosts:
            - protocol.east.kamiwaza.example
          ports:
            - 443
          transport: MutualTLS
          authentication:
            type: WorkloadIdentityX509
            maxConnectionAge: 15m
            workloadIdentityX509:
              trustDomain: east.kamiwaza.example
              acceptedIdentities:
                - spiffe://east.kamiwaza.example/ns/kw-federation-east/sa/kamiwaza-dataplane
          enforcementMode: PolicyAwareDialer
