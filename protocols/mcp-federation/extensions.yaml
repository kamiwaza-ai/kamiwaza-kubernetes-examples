apiVersion: v1
kind: ConfigMap
metadata:
  name: extension-bundle-a6e505c20e76
  namespace: kw-mcp-federation
data:
  bundle.yaml: |
    apiVersion: extensions.kamiwaza.io/bundle-v1alpha1
    components:
    - name: api
      image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
      command:
      - python
      - -c
      args:
      - |
            import json
            from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

            SOURCE = 'records'
            TOOLS = [
                {
                    "name": "lookup",
                    "description": "Return the source and query",
                    "inputSchema": {
                        "type": "object",
                        "properties": {"query": {"type": "string", "maxLength": 256}},
                        "required": ["query"],
                        "additionalProperties": False,
                    },
                },
                {
                    "name": 'record_count',
                    "description": "Return the source identity",
                    "inputSchema": {"type": "object", "additionalProperties": False},
                },
                {
                    "name": "restricted",
                    "description": "Administrative contract probe",
                    "inputSchema": {"type": "object", "additionalProperties": False},
                },
            ]

            class Handler(BaseHTTPRequestHandler):
                def reply(self, status, payload=None, headers=None):
                    if payload is None:
                        body = b""
                    else:
                        body = json.dumps(payload, separators=(",", ":")).encode()
                    self.send_response(status)
                    if payload is not None:
                        self.send_header("Content-Type", "application/json")
                    for name, value in (headers or {}).items():
                        self.send_header(name, value)
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)

                def do_GET(self):
                    if self.path == "/healthz":
                        self.reply(200, {"status": "ready", "source": SOURCE})
                    elif self.path == "/mcp":
                        headers = {"Allow": "POST, DELETE"}
                        self.reply(405, {"error": "server-initiated streams are not used"}, headers)
                    else:
                        self.reply(404, {"error": "not found"})

                def do_DELETE(self):
                    if self.path != "/mcp" or not self.headers.get("MCP-Session-Id"):
                        self.reply(400, {"error": "session id required"})
                        return
                    self.reply(204)

                def do_POST(self):
                    if self.path != "/mcp":
                        self.reply(404, {"error": "not found"})
                        return
                    if self.headers.get("Content-Type", "").split(";", 1)[0] != "application/json":
                        self.reply(415, {"error": "application/json is required"})
                        return
                    length = int(self.headers.get("Content-Length", "0"))
                    if length < 2 or length > 65536:
                        self.reply(413, {"error": "invalid payload size"})
                        return
                    try:
                        request = json.loads(self.rfile.read(length))
                    except (json.JSONDecodeError, UnicodeDecodeError):
                        self.reply(400, {"error": "invalid JSON"})
                        return
                    if not isinstance(request, dict):
                        self.reply(400, {"error": "JSON-RPC request must be an object"})
                        return
                    request_id = request.get("id")
                    method = request.get("method")
                    if request.get("jsonrpc") != "2.0" or not isinstance(method, str):
                        self.reply(400, {"error": "invalid JSON-RPC request"})
                        return
                    if request_id is None:
                        self.reply(202)
                        return
                    if method == "initialize":
                        self.initialize(request, request_id)
                        return
                    if method == "ping":
                        result = {}
                    elif method == "tools/list":
                        result = {"tools": TOOLS}
                    elif method == "tools/call":
                        result = self.call_tool(request, request_id)
                        if result is None:
                            return
                    else:
                        error = {"code": -32601, "message": "method not found"}
                        self.reply(200, {"jsonrpc": "2.0", "id": request_id, "error": error})
                        return
                    self.reply(200, {"jsonrpc": "2.0", "id": request_id, "result": result})

                def initialize(self, request, request_id):
                    if request.get("params", {}).get("protocolVersion") != "2025-11-25":
                        error = {"code": -32602, "message": "unsupported protocol version"}
                        self.reply(200, {"jsonrpc": "2.0", "id": request_id, "error": error})
                        return
                    result = {
                        "protocolVersion": "2025-11-25",
                        "capabilities": {"tools": {"listChanged": False}},
                        "serverInfo": {"name": SOURCE + "-tools", "version": "1.0.0"},
                    }
                    headers = {"MCP-Session-Id": "mcp-" + SOURCE}
                    self.reply(200, {"jsonrpc": "2.0", "id": request_id, "result": result}, headers)

                def call_tool(self, request, request_id):
                    params = request.get("params", {})
                    names = {tool["name"] for tool in TOOLS}
                    if params.get("name") not in names:
                        error = {"code": -32602, "message": "unknown tool"}
                        self.reply(200, {"jsonrpc": "2.0", "id": request_id, "error": error})
                        return None
                    arguments = params.get("arguments", {})
                    query = arguments.get("query", "")
                    if not isinstance(query, str) or len(query) > 256:
                        error = {"code": -32602, "message": "invalid arguments"}
                        self.reply(200, {"jsonrpc": "2.0", "id": request_id, "error": error})
                        return None
                    output = {"source": SOURCE, "tool": params["name"], "query": query}
                    return {
                        "content": [{"type": "text", "text": json.dumps(output)}],
                        "structuredContent": output,
                    }

                def log_message(self, *args):
                    pass

            ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
      ports:
      - name: mcp
        port: 8080
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      volumes:
      - name: tmp
        mountPath: /tmp
        kind: scratch
---
