apiVersion: protocols.kamiwaza.io/v1alpha1
kind: MCPFederation
metadata:
  name: team-tools
  namespace: kw-mcp-federation
spec:
  protocolVersion: "2025-11-25"
  transport: StreamableHTTP
  path: /mcp/team-tools
  sources:
    - name: records
      targetRef:
        group: extensions.kamiwaza.io
        kind: Extension
        name: records-tools
        sectionName: mcp
    - name: catalog
      targetRef:
        group: extensions.kamiwaza.io
        kind: Extension
        name: catalog-tools
        sectionName: mcp
  toolNameCollisionPolicy: PrefixSource
  sourceFailurePolicy: IsolateUnavailable
