apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kamiwaza-platform-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: kamiwaza-administration
  source:
    repoURL: https://github.com/kamiwaza-internal/kamiwaza-platform-operator.git
    targetRevision: ac52a6116f686f94f11c0895bcaea2c01b224d12
    path: charts/kamiwaza-platform-operator
    helm:
      values: |
        manager:
          watchNamespaces:
            - kw-gitops
          watchAnyNamespace: false
        adminPolicy:
          revision: kw-gitops-r1
          allowedTargetNamespaces:
            - kw-gitops
          storage:
            allowedClassNames:
              - example-rwo
              - absent-class
            allowedSharedClassNames: []
          routing:
            gateway:
              name: kamiwaza-gateway
              namespace: kw-gitops
              sectionName: https
          trust:
            managementPolicy: CertManager
            issuer:
              group: cert-manager.io
              kind: ClusterIssuer
              name: infra-ca
            certificate:
              duration: 8760h
              renewBefore: 720h
              privateKey:
                algorithm: ECDSA
                size: 384
                encoding: PKCS8
                rotationPolicy: Always
            bundle:
              configMapName: kamiwaza-trust-bundle
              sourceSecretName: core-client-tls
              sourceKey: ca.crt
          images:
            requireDigests: true
            allowedRepositoryPrefixes:
              - ghcr.io/kamiwaza-internal/
              - ghcr.io/authzed/
              - ghcr.io/agentgateway/
            pullSecretNames:
              - registry-pull
          modelRegistry:
            type: OCIRegistry
            endpoint: registry.kw-gitops.svc.cluster.local:5000
            credentialSecretName: kamiwaza-registry-credentials
            usernameKey: username
            passwordKey: password
          metadataCatalog:
            provider: DataHub
          observability:
            allowedModes: [Disabled]
            approvedSinks: []
            monitoring:
              enabled: false
              provider: PrometheusOperator
          operations:
            adoptionAllowed: false
            deleteAllAllowed: false
            genericSecretRotationAllowed: false
            approvedForwardOnlyUpgradeTargets:
              - 1.3.0
          extensions:
            enabled: true
            allowedNamespaces:
              - kw-gitops
            allowNamespaceCreation: false
            allowCrossNamespaceResources: false
            hostDiscovery: Disabled
            sandbox: Disabled
            dynamicRBAC: Disabled
          dependencies:
            certManager:
              managementPolicy: External
              versionConstraint: '>=1.20.0 <2.0.0'
              evidenceSource: AdminAttested
              namespace: cert-manager
            trustManager:
              managementPolicy: External
              versionConstraint: '>=0.22.0 <1.0.0'
              evidenceSource: AdminAttested
              namespace: kw-gitops
            routing:
              managementPolicy: External
              versionConstraint: '>=1.28.0 <2.0.0'
              evidenceSource: AdminAttested
              namespace: kw-gitops
            gatewayAPI:
              managementPolicy: External
              versionConstraint: '>=1.4.0 <2.0.0'
              evidenceSource: AdminAttested
              namespace: kw-gitops
          domains:
            allocationMode: ExplicitAllowlist
            allowedDomains:
              - gitops.example.invalid
            allowedSuffixes: []
  destination:
    server: https://kubernetes.default.svc
    namespace: kamiwaza-platform-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kamiwaza-tenant
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: kamiwaza-tenants
  source:
    repoURL: https://github.com/kamiwaza-ai/kamiwaza-kubernetes-examples.git
    targetRevision: 800dfe01113c5d642572aaa0c37fef0ebf337fba
    path: gitops/self-service/desired-state/tenant
  destination:
    server: https://kubernetes.default.svc
    namespace: kw-gitops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
