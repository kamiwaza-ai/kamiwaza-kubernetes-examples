apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kamiwaza-platform-operator
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/kamiwaza-internal/kamiwaza-platform-operator.git
  ref:
    commit: ac52a6116f686f94f11c0895bcaea2c01b224d12
  secretRef:
    name: platform-operator-repository
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kamiwaza-examples
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/kamiwaza-ai/kamiwaza-kubernetes-examples.git
  ref:
    commit: 800dfe01113c5d642572aaa0c37fef0ebf337fba
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kamiwaza-operator
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: kamiwaza-examples
  path: ./gitops/self-service/desired-state/admin
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kamiwaza-platform-operator
      namespace: kamiwaza-platform-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kamiwaza-tenant
  namespace: flux-system
spec:
  dependsOn:
    - name: kamiwaza-operator
  interval: 10m
  timeout: 35m
  wait: true
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: kamiwaza-examples
  path: ./gitops/self-service/desired-state/tenant
  healthChecks:
    - apiVersion: platform.kamiwaza.io/v1alpha1
      kind: KamiwazaPlatform
      name: kamiwaza
      namespace: kw-gitops
