# The three objects an administrator applies once. Everything else in this
# scenario is delivered from the source they name, which is the point: after
# this file, the cluster is changed by changing the source, not by running a
# command.
#
# Namespaces and the image pull Secret are deliberately not here. They are
# administrator-owned prerequisites, they are created before this file is
# applied, and a Secret does not belong in a delivery source in clear text.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kamiwaza-config
  namespace: flux-system
spec:
  interval: 10m
  # The published configuration for this installation. Replace with your own
  # artifact: this repository's layout is what the two paths below expect.
  url: oci://registry.example.com/kamiwaza/kubernetes-examples
  ref:
    # A tag is resolved on every interval, so what runs can change without the
    # source changing. Pin `digest:` instead once you know the artifact you
    # reviewed, and let an automated update change the digest through the same
    # source rather than out of band.
    tag: "1.3.0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kamiwaza-manager
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: kamiwaza-config
  path: ./gitops/flux/manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kamiwaza-platform
  namespace: flux-system
spec:
  # The platform is applied only after the manager layer is ready, because the
  # manager layer is what installs the API this layer applies against. Without
  # the dependency the first apply fails on a kind that does not exist yet and
  # recovers on a later interval, which converges but reports a failure that
  # is not one.
  dependsOn:
    - name: kamiwaza-manager
  interval: 30m
  retryInterval: 2m
  # A first install pulls every platform image and runs the ordered component
  # graph, so the wait below has to outlast that rather than the API call.
  timeout: 60m
  # Deliberately false. Pruning this layer deletes the platform, and deleting
  # the platform runs the finalizer's retention behavior. That decision has a
  # workflow of its own (../../operator/deletion/); it should not be a
  # side effect of a file disappearing from a source.
  prune: false
  wait: true
  sourceRef:
    kind: OCIRepository
    name: kamiwaza-config
  path: ./gitops/platform
  healthCheckExprs:
    - apiVersion: platform.kamiwaza.ai/v1alpha1
      kind: KamiwazaPlatform
      # `exists`, not `filter(...).all(...)`. An empty list satisfies `all`, so
      # the common spelling reports a platform that has no conditions yet --
      # every platform, for the first seconds of its life -- as healthy, and
      # the wait returns before the operator has looked at it once.
      #
      # The generation comparison is what makes this an answer about the
      # applied revision. The operator stamps `observedGeneration` on each
      # condition, so a stale `Ready=True` from the previous revision does not
      # satisfy the check for the new one.
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True' && e.observedGeneration == metadata.generation)
      # Blocked is the operator's terminal answer: immutable policy, an
      # administrator-owned prerequisite, or intent it will not act on. It is
      # reported as failed rather than left to time out, so the reason reaches
      # the Kustomization's own condition instead of a reader having to go
      # find it.
      failed: status.conditions.exists(e, e.type == 'Blocked' && e.status == 'True' && e.observedGeneration == metadata.generation)
