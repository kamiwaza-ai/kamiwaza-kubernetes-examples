apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The manager layer holds the chart source and the release that installs the
# published API schemas and one manager. The namespaces it installs into are
# administrator-owned and are not listed here: the operator never creates a
# target namespace, and a delivery layer that could prune one is a delivery
# layer that can delete a platform's namespace by accident.
resources: [helmrelease.yaml]
