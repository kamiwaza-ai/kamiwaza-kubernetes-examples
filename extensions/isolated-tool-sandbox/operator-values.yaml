manager:
  watchNamespaces:
    - kw-tool-sandbox
  watchAnyNamespace: false
adminPolicy:
  revision: kw-tool-sandbox-r1
  allowedTargetNamespaces:
    - kw-tool-sandbox
  storage:
    allowedClassNames:
      - example-rwo
      - absent-class
    allowedSharedClassNames: []
  routing:
    gateway:
      name: kamiwaza-gateway
      namespace: kw-tool-sandbox
      sectionName: https
  trust:
    managementPolicy: CertManager
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-ca
    certificate:
      duration: 8760h
      renewBefore: 720h
      privateKey:
        algorithm: ECDSA
        size: 384
        encoding: PKCS8
        rotationPolicy: Always
    bundle:
      configMapName: kamiwaza-trust-bundle
      sourceSecretName: core-client-tls
      sourceKey: ca.crt
  images:
    requireDigests: true
    allowedRepositoryPrefixes:
      - ghcr.io/kamiwaza-internal/
      - ghcr.io/authzed/
      - ghcr.io/agentgateway/
      - docker.io/library/
      - docker.io/mendhak/
    pullSecretNames:
      - registry-pull
  modelRegistry:
    type: OCIRegistry
    endpoint: registry.kw-tool-sandbox.svc.cluster.local:5000
    credentialSecretName: kamiwaza-registry-credentials
    usernameKey: username
    passwordKey: password
  metadataCatalog:
    provider: DataHub
  observability:
    allowedModes:
      - Disabled
    approvedSinks: []
    monitoring:
      enabled: false
      provider: PrometheusOperator
  operations:
    adoptionAllowed: false
    deleteAllAllowed: false
    genericSecretRotationAllowed: false
    approvedForwardOnlyUpgradeTargets:
      - 1.3.0
  extensions:
    enabled: true
    allowedNamespaces:
      - kw-tool-sandbox
    allowNamespaceCreation: false
    allowCrossNamespaceResources: false
    hostDiscovery: Disabled
    sandbox: AgentSandbox
    dynamicRBAC: Disabled
  dependencies:
    certManager:
      managementPolicy: External
      versionConstraint: ">=1.20.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: cert-manager
    trustManager:
      managementPolicy: External
      versionConstraint: ">=0.22.0 <1.0.0"
      evidenceSource: AdminAttested
      namespace: kw-tool-sandbox
    routing:
      managementPolicy: External
      versionConstraint: ">=1.28.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-tool-sandbox
    gatewayAPI:
      managementPolicy: External
      versionConstraint: ">=1.4.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-tool-sandbox
  domains:
    allocationMode: ExplicitAllowlist
    allowedDomains:
      - sandbox.example.invalid
    allowedSuffixes: []
  transport:
    issuance:
      mode: PlatformIssued
    trust:
      bundleConfigMapName: kamiwaza-trust-bundle
      targetNamespaces:
        - kw-tool-sandbox
      publicRoots: Include
      maximumBundleBytes: 900000
    floor:
      minimumTLSVersion: TLS1.2
      hostnameVerification: Required
    internal:
      defaultTransport: PlatformTLS
      workloadIngressFloor: true
    egress:
      deniedNetworks:
        - Loopback
        - LinkLocal
        - CloudMetadata
        - PrivateRanges
      destinations: []
      proxies: []
    clientIdentities: []
