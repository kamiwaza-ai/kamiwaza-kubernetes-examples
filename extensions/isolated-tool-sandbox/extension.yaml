apiVersion: v1
kind: ConfigMap
metadata:
  name: extension-bundle-aa34b90b3241
  namespace: kw-tool-sandbox
data:
  bundle.yaml: |
    apiVersion: extensions.kamiwaza.io/bundle-v1alpha1
    components:
    - name: api
      image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
      command:
      - python
      - -c
      args:
      - |
        import hashlib, json, os, ssl, time, urllib.error, urllib.parse, urllib.request
        from datetime import datetime, timedelta, timezone
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        host = os.environ["KUBERNETES_SERVICE_HOST"]
        port = os.environ["KUBERNETES_SERVICE_PORT_HTTPS"]
        api = f"https://{host}:{port}"
        namespace = open("/var/run/secrets/kubernetes.io/serviceaccount/namespace").read()
        token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
        context = ssl.create_default_context(
            cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        )


        def kube(path, method="GET", body=None):
            headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}
            request = urllib.request.Request(
                api + path,
                data=json.dumps(body).encode() if body else None,
                headers=headers,
                method=method,
            )
            return json.load(urllib.request.urlopen(request, context=context, timeout=10))


        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"healthy")

            def do_POST(self):
                body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", "0"))))
                if (
                    set(body) != {"marker"}
                    or not isinstance(body["marker"], str)
                    or len(body["marker"]) > 64
                ):
                    self.send_error(400)
                    return
                suffix = hashlib.sha256(
                    (body["marker"] + str(time.time_ns())).encode()
                ).hexdigest()[:10]
                name = "tool-" + suffix
                claim = {
                    "apiVersion": "extensions.agents.x-k8s.io/v1beta1",
                    "kind": "SandboxClaim",
                    "metadata": {
                        "name": name,
                        "namespace": namespace,
                        "labels": {"kamiwaza.io/request": "isolated-tool"},
                    },
                    "spec": {
                        "warmPoolRef": {"name": "tool-sandboxes"},
                        "lifecycle": {
                            "shutdownPolicy": "Delete",
                            "shutdownTime": (datetime.now(timezone.utc) + timedelta(seconds=60))
                            .isoformat()
                            .replace("+00:00", "Z"),
                            "ttlSecondsAfterFinished": 0,
                        },
                    },
                }
                kube(
                    f"/apis/extensions.agents.x-k8s.io/v1beta1/namespaces/{namespace}/sandboxclaims",
                    "POST",
                    claim,
                )
                ready = None
                for _ in range(60):
                    ready = kube(
                        f"/apis/extensions.agents.x-k8s.io/v1beta1/namespaces/{namespace}/sandboxclaims/{name}"
                    )
                    if any(
                        item["type"] == "Ready" and item["status"] == "True"
                        for item in ready.get("status", {}).get("conditions", [])
                    ):
                        break
                    time.sleep(1)
                else:
                    raise RuntimeError("sandbox claim did not become Ready")
                sandbox = ready["status"]["sandbox"]
                url = (
                    "http://"
                    + sandbox["serviceFQDN"]
                    + ":8080/?marker="
                    + urllib.parse.quote(body["marker"])
                )
                echo = urllib.request.urlopen(url, timeout=10).read().decode()
                result = json.dumps(
                    {
                        "claim": name,
                        "sandbox": sandbox["name"],
                        "distinct": sandbox["name"] != os.environ.get("HOSTNAME"),
                        "markerEchoed": body["marker"] in echo,
                    }
                ).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(result)

            def log_message(self, *args):
                pass


        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
      ports:
      - name: http
        port: 8080
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      volumes:
      - name: tmp
        mountPath: /tmp
        kind: scratch
---
apiVersion: extensions.kamiwaza.io/v1alpha1
kind: SandboxPool
metadata:
  name: tool-sandboxes
  namespace: kw-tool-sandbox
spec:
  warmPoolSize: 1
  workerImage: docker.io/mendhak/http-https-echo@sha256:59e97e9c457c280359897ea77baf6e18c3c9b3c58a8f0dd702775d1929576245
  workerPort: 8080
  maxLifetimeSeconds: 120
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
---
apiVersion: extensions.kamiwaza.io/v1alpha1
kind: ExtensionRuntime
metadata:
  name: isolated-tools
  namespace: kw-tool-sandbox
spec:
  domain: sandbox.example.invalid
  sandbox:
    poolRef: tool-sandboxes
  identity:
    contractVersions:
      - v1
  config:
    sandboxRequired: true
    runtimeClassName: gvisor
    destinationClasses: []
---
apiVersion: extensions.kamiwaza.io/v1alpha1
kind: Extension
metadata:
  name: isolated-tool
  namespace: kw-tool-sandbox
  labels:
    kamiwaza.io/runtime: isolated-tools
spec:
  package:
    repository: example.invalid/kamiwaza/extensions/isolated-tool
    version: 1.0.0
    digest: sha256:aa34b90b32414bb3c612bd70af540e201cc32afa52287246d604966a86f6fc29
  state: running
  config:
    kind: Tool
    sandboxRequired: true
