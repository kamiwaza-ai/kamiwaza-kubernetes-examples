apiVersion: batch/v1
kind: Job
metadata:
  name: webhook-check
  namespace: kw-webhook
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command:
            - python
            - -c
          args:
            - |
              import hashlib, hmac, json, os, ssl, time, urllib.request

              body = b'{"event":"example.created","value":1}'
              key = "example-event-001"
              signature = hmac.new(
                  os.environ["WEBHOOK_SECRET"].encode(), body, hashlib.sha256
              ).hexdigest()
              context = ssl.create_default_context(cafile="/trust/ca.crt")
              for _ in range(2):
                  request = urllib.request.Request(
                      "https://webhook.example.invalid/hooks",
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "Idempotency-Key": key,
                          "X-Signature": signature,
                      },
                  )
                  with urllib.request.urlopen(request, context=context, timeout=10) as response:
                      assert response.status == 202
              for attempt in range(20):
                  with urllib.request.urlopen(
                      "http://webhook-receiver:8080/results/" + key, timeout=5
                  ) as response:
                      result = json.load(response)
                  if result["accepted"] == 1:
                      print(json.dumps(result))
                      break
                  if attempt == 19:
                      raise SystemExit(result)
                  time.sleep(min(1 + attempt // 4, 5))
          env:
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-signing
                  key: WEBHOOK_SECRET
          volumeMounts:
            - name: gateway-ca
              mountPath: /trust
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: gateway-ca
          secret:
            secretName: kamiwaza-gateway-tls
            items:
              - key: ca.crt
                path: ca.crt
