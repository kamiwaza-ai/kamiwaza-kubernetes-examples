apiVersion: batch/v1
kind: Job
metadata:
  name: dependency-validation-check
  namespace: platform-validation-dependencies
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dependency-validation-check
        app.kubernetes.io/part-of: platform-validation
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python, /scripts/verify-fixtures.py]
          env: [{ name: VALIDATION_MODE, value: dependencies }]
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
      volumes:
        - { name: scripts, configMap: { name: platform-validation-checks } }
        - { name: tls, secret: { secretName: platform-validation-client-tls } }
        - { name: ca, configMap: { name: platform-validation-ca } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: proxy-validation-check
  namespace: platform-validation-client
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-validation-client
        app.kubernetes.io/part-of: platform-validation
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python, /scripts/verify-fixtures.py]
          env: [{ name: VALIDATION_MODE, value: proxy }]
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
      volumes:
        - { name: scripts, configMap: { name: platform-validation-checks } }
        - { name: tls, secret: { secretName: platform-validation-client-tls } }
        - { name: ca, configMap: { name: platform-validation-ca } }
