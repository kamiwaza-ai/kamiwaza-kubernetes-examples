apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - identity.yaml
  - workloads.yaml
  - network-policies.yaml
  - checks.yaml
configMapGenerator:
  - name: platform-validation-server
    namespace: platform-validation-dependencies
    files: [server.py]
  - name: platform-validation-idp-bootstrap
    namespace: platform-validation-dependencies
    files: [bootstrap-idp.py]
  - name: platform-validation-directory-bootstrap
    namespace: platform-validation-dependencies
    files: [bootstrap-directory.sh]
  - name: platform-validation-checks
    namespace: platform-validation-dependencies
    files: [verify-fixtures.py]
  - name: platform-validation-checks
    namespace: platform-validation-client
    files: [verify-fixtures.py]
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: platform-validation
