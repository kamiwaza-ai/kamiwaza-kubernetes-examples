apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumable-stream
  namespace: platform-validation-dependencies
  labels:
    app.kubernetes.io/name: resumable-stream
    app.kubernetes.io/part-of: platform-validation
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: resumable-stream
      app.kubernetes.io/part-of: platform-validation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumable-stream
        app.kubernetes.io/part-of: platform-validation
    spec:
      containers:
        - name: stream
          image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command: [python, /scripts/server.py]
          env:
            - { name: FIXTURE_MODE, value: stream }
            - { name: PORT, value: "8080" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - { name: scripts, configMap: { name: platform-validation-server } }
---
apiVersion: v1
kind: Service
metadata: { name: resumable-stream, namespace: platform-validation-dependencies }
spec:
  selector:
    app.kubernetes.io/name: resumable-stream
    app.kubernetes.io/part-of: platform-validation
  ports: [{ name: http, port: 8080, targetPort: http }]
