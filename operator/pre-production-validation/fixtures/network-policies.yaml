apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: validation-client-egress
  namespace: platform-validation-client
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-validation-client
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-validation-dependencies
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-proxy
      ports:
        - { protocol: TCP, port: 3128 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-proxy-destination
  namespace: platform-validation-dependencies
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: egress-proxy
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mutual-tls-destination
      ports:
        - { protocol: TCP, port: 8443 }
