# An extension's component graph, carried in the artifact its digest pins.
#
# Three components, named for the three roles a real extension runs: a request
# API, a background worker, and a document worker. None of them does any work.
# Each one proves the platform callback contract instead -- that every
# platform-integrated component receives the same projected origin, and that a
# callback through it reaches both published route families.
#
# The prober is passed as an argument rather than mounted, because a bundle
# component declares its own image, command, and environment and does not
# reach into the namespace for a ConfigMap this scenario would then have to
# keep in step with the artifact's digest.
apiVersion: extensions.kamiwaza.io/bundle-v1alpha1
components:
  - name: api
    image: cgr.dev/chainguard/python@sha256:5df43ab0f8ea19e305ad41fff3eef71a836aa2392c4c3f25c90d2d00fbf5fc52
    command: [python, -c, PROBER_SOURCE]
    env:
      SERVICE_NAME: api
      PLATFORM_DOMAIN: PLATFORM_DOMAIN_VALUE
    # Every component states its own requests and limits. A container
    # without limits can starve every other workload on the node, so the
    # platform refuses to render one.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    ports:
      - name: http
        port: 8080
  - name: background-worker
    image: cgr.dev/chainguard/python@sha256:5df43ab0f8ea19e305ad41fff3eef71a836aa2392c4c3f25c90d2d00fbf5fc52
    command: [python, -c, PROBER_SOURCE]
    env:
      SERVICE_NAME: background-worker
      PLATFORM_DOMAIN: PLATFORM_DOMAIN_VALUE
    # Every component states its own requests and limits. A container
    # without limits can starve every other workload on the node, so the
    # platform refuses to render one.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  - name: document-worker
    image: cgr.dev/chainguard/python@sha256:5df43ab0f8ea19e305ad41fff3eef71a836aa2392c4c3f25c90d2d00fbf5fc52
    command: [python, -c, PROBER_SOURCE]
    env:
      SERVICE_NAME: document-worker
      PLATFORM_DOMAIN: PLATFORM_DOMAIN_VALUE
    # Every component states its own requests and limits. A container
    # without limits can starve every other workload on the node, so the
    # platform refuses to render one.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
