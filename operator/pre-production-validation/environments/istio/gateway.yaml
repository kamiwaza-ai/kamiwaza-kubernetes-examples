apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kamiwaza-gateway
  namespace: kamiwaza-examples-secondary
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: kamiwaza.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: kamiwaza-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
