# The same environment-owned statements as the first environment, plus the
# cluster identity for this installation. `spec.clusterID` identifies retained
# volumes and operator-created Secrets after a RetainData delete, so the two
# installations never share one.
apiVersion: platform.kamiwaza.io/v1alpha1
kind: KamiwazaPlatform
metadata:
  name: kamiwaza
  # The base namespace, because a patch is matched before the namespace
  # transformer moves the object into this environment's namespace.
  namespace: kamiwaza-examples
spec:
  clusterID: kamiwaza-examples-secondary
  dependencies:
    certManager:
      required: false
    trustManager:
      required: false
