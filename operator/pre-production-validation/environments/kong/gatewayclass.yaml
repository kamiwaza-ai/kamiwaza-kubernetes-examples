# Kong ships no GatewayClass of its own, so the administrator declares the
# class this environment's Gateway selects.
#
# The annotation is this implementation's own requirement: without it the
# controller accepts the class and then reconciles no Gateway, because it
# expects to have provisioned the data plane itself. It lives here, in the
# environment that installed that controller, and never in platform intent —
# the platform selects a Gateway by name and never learns which implementation
# serves it.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kong
  annotations:
    konghq.com/gatewayclass-unmanaged: "true"
spec:
  controllerName: konghq.com/kic-gateway-controller
