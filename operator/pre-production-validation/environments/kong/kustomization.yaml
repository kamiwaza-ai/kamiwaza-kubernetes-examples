apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The third environment runs the same published intent in its own namespace
# under a third routing implementation. Two implementations can agree by
# coincidence; a third is what makes "agnostic" a measurement.
resources: [gateway.yaml, ../../../quickstart]
namespace: kamiwaza-examples-third
patches: [{ path: platform.yaml }]
