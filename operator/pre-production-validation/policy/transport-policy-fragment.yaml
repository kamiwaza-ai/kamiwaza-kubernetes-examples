transport:
  issuance:
    mode: PlatformIssued
    platformIssued:
      authorityValidity: 8760h
      authorityRenewBefore: 720h
      leafValidity: 2160h
      leafRenewBefore: 360h
      expirationPolicy: ReplaceKey
      privateKeyPolicy: { algorithm: ECDSA, size: 384, rotationPolicy: Always }
      # Internal hops here authenticate with workload identity, and the
      # protected protocol data plane enrolls a client identity, so this
      # fragment must also say where workload identity comes from. Without
      # this block the platform signs nothing for workloads and the data
      # plane reports that no file-backed client material is projected.
      #
      # OfflineTokenReview is the floor: it verifies a projected
      # ServiceAccount token without any cluster-scoped permission. Select
      # ApiTokenReview only where that permission is granted deliberately.
      workloadIdentity:
        source: PlatformIssued
        trustDomain: kamiwaza-examples.example.com
        attestation: OfflineTokenReview
        identityLifetime: 24h
        identityRenewBefore: 8h
    maintenanceWindows: ["0 2 * * 6"]
  trust:
    bundleConfigMapName: kamiwaza-trust-bundle
    publicRoots: Include
    maximumBundleBytes: 900000
    targetNamespaces: [kamiwaza, kamiwaza-extensions]
    additionalAuthorities:
      - name: enterprise-root-2026
        description: Retiring enterprise root, retained for the rotation overlap
        secretRef: { name: enterprise-trust, key: root-2026.pem }
      - name: enterprise-root-2027
        secretRef: { name: enterprise-trust, key: root-2027.pem }
  floor: { minimumTLSVersion: TLS1.2, hostnameVerification: Required }
  edge:
    listenerCertificate: PlatformIssued
    listenerCertificateSecretName: kamiwaza-gateway-tls
    httpsRedirect: RequireWhenSupported
    backendTLS: RequireWhenSupported
    clientCertificate:
      mode: RequireValid
      authorityConfigMapName: kamiwaza-edge-client-ca
      forwardingMode: ExternalEdgeHeader
      externalEvidenceRef: { name: edge-conformance, key: result.json }
  internal:
    defaultTransport: PlatformTLS
    workloadIngressFloor: true
    hops:
      # The application API's own identity is raised from the hops it carries,
      # and a hop that names no accepted identity cannot raise one: an empty
      # accepted set would admit every workload the trust domain will ever
      # issue, and a set the platform invented would be a peer list nobody
      # reviewed. So the callers of the application API are named here.
      #
      # The namespace inside each identity is this installation's namespace,
      # substituted the same way the trust distribution target is.
      - name: GatewayToCore
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityX509
          maxConnectionAge: 30m
          workloadIdentityX509:
            trustDomain: kamiwaza-examples.example.com
            acceptedIdentities:
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/kamiwaza-dataplane
      # Every platform workload raises its identity from the hops it carries,
      # so each hop a workload carries states which peers it accepts. The
      # application API, its task runner, and the retrieval streamer all run
      # under platform service accounts in this namespace, and those are the
      # only peers named.
      - name: CoreToApplicationDatabase
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityX509
          maxConnectionAge: 30m
          workloadIdentityX509:
            trustDomain: kamiwaza-examples.example.com
            acceptedIdentities:
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/core-scheduler
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/core-retrieval-streamer
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/core-db-init
      - name: CoreToKeyValueStore
        transport: PlatformTLS
        authentication:
          { type: MutualTLS, maxConnectionAge: 30m, mutualTLS: { clientIdentityRef: core-client } }
      - name: CoreToIdentityProvider
        transport: PlatformTLS
        authentication: { type: None }
      - name: CoreToServedModel
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityJWT
          maxConnectionAge: 30m
          workloadIdentityJWT:
            audience: kamiwaza-workload-sts
            attestationProfiles: [kubernetes-tokenreview-v1, kubernetes-offline-v1]
            ttlSeconds: 3600
      # The governed endpoint's hop to a locally served model. Declaring it
      # PlatformTLS is what makes the platform project a server identity and
      # the pinned proxy into the served model's own Pod, so the data plane's
      # backend TLS has something that terminates it. Leaving this hop out
      # left the route rendering backend TLS against a plaintext container,
      # which presents as a gateway timeout rather than as missing policy.
      #
      # The accepted peer is the data plane itself: nothing else dials a
      # served model on this hop.
      - name: ProtocolDataPlaneToServedModel
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityX509
          maxConnectionAge: 30m
          workloadIdentityX509:
            trustDomain: kamiwaza-examples.example.com
            acceptedIdentities:
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/kamiwaza-dataplane
      # The governed endpoint's hop to the decision service, carried by the
      # request surface, which is where its peers are already named.
      - name: ProtocolDataPlaneToDecisionService
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityX509
          maxConnectionAge: 30m
          workloadIdentityX509:
            trustDomain: kamiwaza-examples.example.com
            acceptedIdentities:
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/kamiwaza-dataplane
      - name: ExtensionToCore
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityJWT
          maxConnectionAge: 30m
          workloadIdentityJWT:
            audience: kamiwaza-workload-sts
            attestationProfiles: [kubernetes-offline-v1]
      # The delegated compute workloads carry their own two hops, so they
      # name their own peers: the task runner that submits work, and the
      # other members of the compute group.
      - name: CoreToDistributedCompute
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityX509
          maxConnectionAge: 30m
          workloadIdentityX509:
            trustDomain: kamiwaza-examples.example.com
            acceptedIdentities:
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/core-scheduler
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/core-ray
      - name: DistributedComputeInternal
        transport: MeshDelegated
        evidenceSource: AdminAttested
        authentication: { type: None }
      # The retrieval streamer and the initialization Job each carry exactly
      # one hop, so that hop is where their peers are named. The streamer
      # serves the request surface; the Job seeds the datastore and is dialed
      # by nothing, so it names the account it runs under.
      - name: CoreToRetrievalStreamer
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityX509
          maxConnectionAge: 30m
          workloadIdentityX509:
            trustDomain: kamiwaza-examples.example.com
            acceptedIdentities:
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/core-scheduler
      - name: InitializationJobToDatastore
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityX509
          maxConnectionAge: 30m
          workloadIdentityX509:
            trustDomain: kamiwaza-examples.example.com
            acceptedIdentities:
              - spiffe://kamiwaza-examples.example.com/ns/kamiwaza/sa/core-db-init
  clientIdentities:
    - name: core-client
      secretRef: { name: kamiwaza-core-client }
      commonName: core-client
      validity: 2160h
      renewBefore: 360h
    - name: directory-egress
      secretRef: { name: kamiwaza-egress-directory }
      commonName: kamiwaza-directory-egress
      validity: 2160h
      renewBefore: 360h
    - name: inference-egress
      secretRef: { name: kamiwaza-egress-inference }
      commonName: kamiwaza-inference-egress
      validity: 2160h
      renewBefore: 360h
    - name: cac-edge-client
      secretRef: { name: kamiwaza-cac-edge-client }
      commonName: cac-edge-client
      validity: 2160h
      renewBefore: 360h
  egress:
    deniedNetworks: [Loopback, LinkLocal, CloudMetadata, PrivateRanges]
    destinations:
      - name: enterprise-idp
        kind: IdentityProvider
        hosts: [login.example.com]
        ports: [443]
        transport: TLS
        authentication: { type: None }
        enforcementMode: PolicyAwareDialer
        requiredAuthorities: [enterprise-root-2026, enterprise-root-2027]
      - name: enterprise-directory
        kind: Directory
        hosts: [ldap.example.com]
        ports: [636]
        transport: MutualTLS
        authentication:
          {
            type: MutualTLS,
            maxConnectionAge: 30m,
            mutualTLS: { clientIdentityRef: directory-egress },
          }
        requiredAuthorities: [enterprise-root-2027]
        enforcementMode: PolicyAwareDialer
      - name: model-artifacts
        kind: ModelArtifactRegistry
        hosts: [registry.example.com]
        ports: [443]
        transport: TLS
        authentication:
          {
            type: OAuth2ClientCredentials,
            maxConnectionAge: 15m,
            oauth2ClientCredentials:
              {
                tokenEndpoint: "https://auth.example.com/oauth2/token",
                clientID: kamiwaza-registry,
                clientSecretRef: { name: registry-oauth, key: client-secret },
                audience: registry.example.com,
                scopes: [repository:read],
                maxTokenLifetime: 15m,
              },
          }
        enforcementMode: PolicyAwareDialer
      - name: inference-provider
        kind: ModelProvider
        hosts: [api.provider.example.com]
        ports: [443]
        transport: MutualTLS
        authentication:
          {
            type: CertificateBoundOAuth,
            maxConnectionAge: 15m,
            certificateBoundOAuth:
              {
                tokenEndpoint: "https://auth.provider.example.com/token",
                clientID: kamiwaza,
                clientIdentityRef: inference-egress,
                audience: api.provider.example.com,
                maxTokenLifetime: 15m,
              },
          }
        enforcementMode: PolicyAwareDialerViaProxy
        proxyRef: corporate-egress
      - name: extension-apis
        kind: ExtensionExternalAPI
        hosts: ["*.partner.example.com"]
        ports: [443]
        transport: TLS
        authentication: { type: None }
        enforcementMode: EnforcingProxy
        proxyRef: corporate-egress
    proxies:
      - name: corporate-egress
        url: https://proxy.example.com:3128
        authorityName: enterprise-root-2027
        enforcesDestinationPolicy: true
        evidenceRef: { name: proxy-conformance, key: result.json }
