transport:
  issuance:
    mode: PlatformIssued
    platformIssued:
      authorityValidity: 8760h
      authorityRenewBefore: 720h
      leafValidity: 2160h
      leafRenewBefore: 360h
      expirationPolicy: ReplaceKey
      privateKeyPolicy: { algorithm: ECDSA, size: 384, rotationPolicy: Always }
    maintenanceWindows: ["0 2 * * 6"]
  trust:
    bundleConfigMapName: kamiwaza-trust-bundle
    publicRoots: Include
    maximumBundleBytes: 900000
    targetNamespaces: [kamiwaza, kamiwaza-extensions]
    additionalAuthorities:
      - name: enterprise-root-2026
        description: Retiring enterprise root, retained for the rotation overlap
        secretRef: { name: enterprise-trust, key: root-2026.pem }
      - name: enterprise-root-2027
        secretRef: { name: enterprise-trust, key: root-2027.pem }
  floor: { minimumTLSVersion: TLS1.2, hostnameVerification: Required }
  edge:
    listenerCertificate: PlatformIssued
    listenerCertificateSecretName: kamiwaza-gateway-tls
    httpsRedirect: RequireWhenSupported
    backendTLS: RequireWhenSupported
    clientCertificate:
      mode: RequireValid
      authorityConfigMapName: kamiwaza-edge-client-ca
      forwardingMode: ExternalEdgeHeader
      externalEvidenceRef: { name: edge-conformance, key: result.json }
  internal:
    defaultTransport: PlatformTLS
    workloadIngressFloor: true
    hops:
      - name: CoreToApplicationDatabase
        transport: PlatformTLS
        authentication:
          { type: MutualTLS, maxConnectionAge: 30m, mutualTLS: { clientIdentityRef: core-client } }
      - name: CoreToKeyValueStore
        transport: PlatformTLS
        authentication:
          { type: MutualTLS, maxConnectionAge: 30m, mutualTLS: { clientIdentityRef: core-client } }
      - name: CoreToIdentityProvider
        transport: PlatformTLS
        authentication: { type: None }
      - name: CoreToServedModel
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityJWT
          maxConnectionAge: 30m
          workloadIdentityJWT:
            audience: kamiwaza-workload-sts
            attestationProfiles: [kubernetes-tokenreview-v1, kubernetes-offline-v1]
            ttlSeconds: 3600
      - name: ExtensionToCore
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityJWT
          maxConnectionAge: 30m
          workloadIdentityJWT:
            audience: kamiwaza-workload-sts
            attestationProfiles: [kubernetes-offline-v1]
      - name: DistributedComputeInternal
        transport: MeshDelegated
        evidenceSource: AdminAttested
        authentication: { type: None }
  clientIdentities:
    - name: core-client
      secretRef: { name: kamiwaza-core-client }
      commonName: core-client
      validity: 2160h
      renewBefore: 360h
    - name: directory-egress
      secretRef: { name: kamiwaza-egress-directory }
      commonName: kamiwaza-directory-egress
      validity: 2160h
      renewBefore: 360h
    - name: inference-egress
      secretRef: { name: kamiwaza-egress-inference }
      commonName: kamiwaza-inference-egress
      validity: 2160h
      renewBefore: 360h
    - name: cac-edge-client
      secretRef: { name: kamiwaza-cac-edge-client }
      commonName: cac-edge-client
      validity: 2160h
      renewBefore: 360h
  egress:
    deniedNetworks: [Loopback, LinkLocal, CloudMetadata, PrivateRanges]
    destinations:
      - name: enterprise-idp
        kind: IdentityProvider
        hosts: [login.example.com]
        ports: [443]
        transport: TLS
        authentication: { type: None }
        enforcementMode: PolicyAwareDialer
        requiredAuthorities: [enterprise-root-2026, enterprise-root-2027]
      - name: enterprise-directory
        kind: Directory
        hosts: [ldap.example.com]
        ports: [636]
        transport: MutualTLS
        authentication:
          {
            type: MutualTLS,
            maxConnectionAge: 30m,
            mutualTLS: { clientIdentityRef: directory-egress },
          }
        requiredAuthorities: [enterprise-root-2027]
        enforcementMode: PolicyAwareDialer
      - name: model-artifacts
        kind: ModelArtifactRegistry
        hosts: [registry.example.com]
        ports: [443]
        transport: TLS
        authentication:
          {
            type: OAuth2ClientCredentials,
            maxConnectionAge: 15m,
            oauth2ClientCredentials:
              {
                tokenEndpoint: "https://auth.example.com/oauth2/token",
                clientID: kamiwaza-registry,
                clientSecretRef: { name: registry-oauth, key: client-secret },
                audience: registry.example.com,
                scopes: [repository:read],
                maxTokenLifetime: 15m,
              },
          }
        enforcementMode: PolicyAwareDialer
      - name: inference-provider
        kind: ModelProvider
        hosts: [api.provider.example.com]
        ports: [443]
        transport: MutualTLS
        authentication:
          {
            type: CertificateBoundOAuth,
            maxConnectionAge: 15m,
            certificateBoundOAuth:
              {
                tokenEndpoint: "https://auth.provider.example.com/token",
                clientID: kamiwaza,
                clientIdentityRef: inference-egress,
                audience: api.provider.example.com,
                maxTokenLifetime: 15m,
              },
          }
        enforcementMode: PolicyAwareDialerViaProxy
        proxyRef: corporate-egress
      - name: extension-apis
        kind: ExtensionExternalAPI
        hosts: ["*.partner.example.com"]
        ports: [443]
        transport: TLS
        authentication: { type: None }
        enforcementMode: EnforcingProxy
        proxyRef: corporate-egress
    proxies:
      - name: corporate-egress
        url: https://proxy.example.com:3128
        authorityName: enterprise-root-2027
        enforcesDestinationPolicy: true
        evidenceRef: { name: proxy-conformance, key: result.json }
