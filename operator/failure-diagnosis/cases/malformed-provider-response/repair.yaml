apiVersion: apps/v1
kind: Deployment
metadata:
  name: malformed-provider
  namespace: kw-failure-diagnosis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: malformed-provider
  template:
    metadata:
      labels:
        app: malformed-provider
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command:
            - python
            - -c
          args:
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json, ssl


              class H(BaseHTTPRequestHandler):
                  def do_POST(self):
                      body = json.dumps(
                          {
                              "id": "failure-ok",
                              "object": "chat.completion",
                              "model": "malformed-provider",
                              "choices": [
                                  {
                                      "index": 0,
                                      "message": {
                                          "role": "assistant",
                                          "content": "provider response valid",
                                      },
                                      "finish_reason": "stop",
                                  }
                              ],
                          }
                      ).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, *args):
                      pass


              server = HTTPServer(("0.0.0.0", 8443), H)
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
              context.load_cert_chain("/tls/tls.crt", "/tls/tls.key")
              server.socket = context.wrap_socket(server.socket, server_side=True)
              server.serve_forever()
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: malformed-provider-tls
---
apiVersion: v1
kind: Service
metadata:
  name: malformed-provider
  namespace: kw-failure-diagnosis
spec:
  selector:
    app: malformed-provider
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: serving.kamiwaza.io/v1alpha1
kind: ModelDeployment
metadata:
  name: malformed-provider
  namespace: kw-failure-diagnosis
spec:
  deploymentId: malformed-provider
  modelId: malformed-provider
  state: running
  external:
    provider: openai_compatible
    credentialSecretRef:
      name: provider-credential
      key: credential
    endpointURL: https://malformed-provider.kw-failure-diagnosis.svc.cluster.local/v1
