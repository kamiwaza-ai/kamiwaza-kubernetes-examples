apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kamiwaza-gateway
  namespace: kw-failure-diagnosis
spec:
  gatewayClassName: replace-with-conformant-class
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: failure.example.invalid
      allowedRoutes:
        namespaces: { from: Same }
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: kamiwaza-gateway-tls
