manager:
  watchNamespaces:
    - kw-failure-diagnosis
  watchAnyNamespace: false
adminPolicy:
  revision: kw-failure-diagnosis-r1
  allowedTargetNamespaces:
    - kw-failure-diagnosis
  storage:
    allowedClassNames:
      - example-rwo
      - absent-class
    allowedSharedClassNames: []
  routing:
    gateway:
      name: kamiwaza-gateway
      namespace: kw-failure-diagnosis
      sectionName: https
  trust:
    managementPolicy: CertManager
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-ca
    certificate:
      duration: 8760h
      renewBefore: 720h
      privateKey:
        algorithm: ECDSA
        size: 384
        encoding: PKCS8
        rotationPolicy: Always
    bundle:
      configMapName: kamiwaza-trust-bundle
      sourceSecretName: core-client-tls
      sourceKey: ca.crt
  images:
    requireDigests: true
    allowedRepositoryPrefixes:
      - ghcr.io/kamiwaza-internal/
      - ghcr.io/authzed/
      - ghcr.io/agentgateway/
      - docker.io/hashicorp/
    pullSecretNames:
      - registry-pull
  modelRegistry:
    type: OCIRegistry
    endpoint: registry.kw-failure-diagnosis.svc.cluster.local:5000
    credentialSecretName: kamiwaza-registry-credentials
    usernameKey: username
    passwordKey: password
  metadataCatalog:
    provider: DataHub
  observability:
    allowedModes:
      - Disabled
    approvedSinks: []
    monitoring:
      enabled: false
      provider: PrometheusOperator
  operations:
    adoptionAllowed: false
    deleteAllAllowed: false
    genericSecretRotationAllowed: false
    approvedForwardOnlyUpgradeTargets:
      - 1.3.0
  extensions:
    enabled: true
    allowedNamespaces:
      - kw-failure-diagnosis
    allowNamespaceCreation: false
    allowCrossNamespaceResources: false
    hostDiscovery: Disabled
    sandbox: Disabled
    dynamicRBAC: Disabled
  dependencies:
    certManager:
      managementPolicy: External
      versionConstraint: ">=1.20.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: cert-manager
    trustManager:
      managementPolicy: External
      versionConstraint: ">=0.22.0 <1.0.0"
      evidenceSource: AdminAttested
      namespace: kw-failure-diagnosis
    routing:
      managementPolicy: External
      versionConstraint: ">=1.28.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-failure-diagnosis
    gatewayAPI:
      managementPolicy: External
      versionConstraint: ">=1.5.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-failure-diagnosis
  domains:
    allocationMode: ExplicitAllowlist
    allowedDomains:
      - failure.example.invalid
    allowedSuffixes: []
  transport:
    issuance:
      mode: PlatformIssued
      platformIssued:
        authorityValidity: 8760h
        authorityRenewBefore: 720h
        leafValidity: 2160h
        leafRenewBefore: 360h
        expirationPolicy: ReplaceKey
        privateKeyPolicy:
          algorithm: ECDSA
          size: 384
          rotationPolicy: Always
      maintenanceWindows:
        - 0 2 * * 6
    trust:
      bundleConfigMapName: kamiwaza-trust-bundle
      publicRoots: Include
      maximumBundleBytes: 900000
      targetNamespaces:
        - kw-failure-diagnosis
      additionalAuthorities: []
    floor:
      minimumTLSVersion: TLS1.2
      hostnameVerification: Required
    edge:
      listenerCertificate: PlatformIssued
      listenerCertificateSecretName: kamiwaza-gateway-tls
      httpsRedirect: RequireWhenSupported
      backendTLS: RequireWhenSupported
      clientCertificate:
        mode: Disabled
    internal:
      defaultTransport: PlatformTLS
      workloadIngressFloor: true
      hops:
        - name: CoreToApplicationDatabase
          transport: PlatformTLS
          authentication:
            type: MutualTLS
            maxConnectionAge: 30m
            mutualTLS:
              clientIdentityRef: core-client
        - name: CoreToKeyValueStore
          transport: PlatformTLS
          authentication:
            type: MutualTLS
            maxConnectionAge: 30m
            mutualTLS:
              clientIdentityRef: core-client
        - name: CoreToIdentityProvider
          transport: PlatformTLS
          authentication:
            type: None
        - name: CoreToServedModel
          transport: PlatformTLS
          authentication:
            type: WorkloadIdentityJWT
            maxConnectionAge: 30m
            workloadIdentityJWT:
              audience: kamiwaza-workload-sts
              attestationProfiles:
                - kubernetes-tokenreview-v1
                - kubernetes-offline-v1
              ttlSeconds: 3600
        - name: ExtensionToCore
          transport: PlatformTLS
          authentication:
            type: WorkloadIdentityJWT
            maxConnectionAge: 30m
            workloadIdentityJWT:
              audience: kamiwaza-workload-sts
              attestationProfiles:
                - kubernetes-offline-v1
        - name: DistributedComputeInternal
          transport: MeshDelegated
          evidenceSource: AdminAttested
          authentication:
            type: None
    clientIdentities:
      - name: core-client
        secretRef:
          name: kamiwaza-core-client
        commonName: core-client
        validity: 2160h
        renewBefore: 360h
    egress:
      deniedNetworks:
        - Loopback
        - LinkLocal
        - CloudMetadata
        - PrivateRanges
      destinations:
        - name: enterprise-idp
          kind: IdentityProvider
          hosts:
            - idp-failure.example.invalid
          ports:
            - 443
          transport: TLS
          authentication:
            type: None
          enforcementMode: PolicyAwareDialer
      proxies: []
  authProfiles:
    - name: built-in
      methods:
        - name: builtin
          type: BuiltInKeycloak
          providerID: builtin-keycloak
          enabled: true
          realm: kamiwaza
          clientID: kamiwaza-platform
          clientSecretRef:
            name: builtin-keycloak-client
            key: client-secret
      jitAdmission: Allowed
      requiredClaims: &id001
        - sub
        - roles
        - tenant_id
      authorizationProjection: ReBACOnly
      tenantContext: RequiredClaimThenReBAC
      assurance: &id002
        requiredACR:
          - urn:example:acr:multifactor
        requiredAMR:
          - pwd
          - otp
      session: &id003
        overallTimeout: 12h
        inactivityTimeout: 30m
        reauthentication: StepUpForSensitiveAction
        tokenAudience: kamiwaza-platform
      failureMode: FailClosed
    - name: oidc
      methods:
        - name: enterprise-oidc
          type: BrokeredOIDC
          providerID: enterprise-oidc
          enabled: true
          issuer: https://idp-failure.example.invalid/realms/failure
          discoveryPolicy: IssuerWellKnown
          destinationClass: enterprise-idp
          clientID: kamiwaza
          clientSecretRef:
            name: enterprise-oidc-client
            key: client-secret
          subjectClaim: sub
          usernameClaims:
            - preferred_username
          emailClaims:
            - email
          groupClaims:
            - groups
          requiredACR:
            - urn:example:acr:multifactor
      jitAdmission: Allowed
      requiredClaims: *id001
      authorizationProjection: ReBACOnly
      tenantContext: RequiredClaimThenReBAC
      assurance: *id002
      session: *id003
      failureMode: FailClosed
