manager:
  watchNamespaces:
    - kamiwaza-examples
    - kamiwaza-examples-extensions
  watchAnyNamespace: false

adminPolicy:
  revision: examples-same-namespace-r1
  allowedTargetNamespaces:
    - kamiwaza-examples
  extensions:
    enabled: true
    platformNamespace: kamiwaza-examples
    runtimeNamespace: kamiwaza-examples-extensions
    allowedNamespaces:
      - kamiwaza-examples-extensions
