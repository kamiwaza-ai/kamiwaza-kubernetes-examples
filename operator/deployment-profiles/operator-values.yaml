manager:
  watchNamespaces:
    - kw-profile-development
    - kw-profile-production
    - kw-profile-restricted
  watchAnyNamespace: false
adminPolicy:
  revision: kw-profile-development-r1
  allowedTargetNamespaces:
    - kw-profile-development
    - kw-profile-production
    - kw-profile-restricted
  storage:
    allowedClassNames:
      - example-rwo
      - absent-class
    allowedSharedClassNames: []
  routing:
    gateway:
      name: kamiwaza-gateway
      namespace: kw-profile-development
      sectionName: https
  trust:
    managementPolicy: CertManager
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-ca
    certificate:
      duration: 8760h
      renewBefore: 720h
      privateKey:
        algorithm: ECDSA
        size: 384
        encoding: PKCS8
        rotationPolicy: Always
    bundle:
      configMapName: kamiwaza-trust-bundle
      sourceSecretName: core-client-tls
      sourceKey: ca.crt
  images:
    requireDigests: true
    allowedRepositoryPrefixes:
      - ghcr.io/kamiwaza-internal/
      - ghcr.io/authzed/
      - ghcr.io/agentgateway/
    pullSecretNames:
      - registry-pull
  modelRegistry:
    type: OCIRegistry
    endpoint: registry.kw-profile-development.svc.cluster.local:5000
    credentialSecretName: kamiwaza-registry-credentials
    usernameKey: username
    passwordKey: password
  metadataCatalog:
    provider: DataHub
  observability:
    allowedModes:
      - Disabled
      - External
    approvedSinks:
      - name: production-otel
        endpoint: http://otel-collector.observability.svc.cluster.local:4318
        protocol: OTLPHTTP
        credentialSecretName: production-otel-credentials
    monitoring:
      enabled: false
      provider: PrometheusOperator
  operations:
    adoptionAllowed: false
    deleteAllAllowed: false
    genericSecretRotationAllowed: false
    approvedForwardOnlyUpgradeTargets:
      - 1.3.0
  extensions:
    enabled: true
    allowedNamespaces:
      - kw-profile-development
    allowNamespaceCreation: false
    allowCrossNamespaceResources: false
    hostDiscovery: Disabled
    sandbox: Disabled
    dynamicRBAC: Disabled
  dependencies:
    certManager:
      managementPolicy: External
      versionConstraint: ">=1.20.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: cert-manager
    trustManager:
      managementPolicy: External
      versionConstraint: ">=0.22.0 <1.0.0"
      evidenceSource: AdminAttested
      namespace: kw-profile-development
    routing:
      managementPolicy: External
      versionConstraint: ">=1.28.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-profile-development
    gatewayAPI:
      managementPolicy: External
      versionConstraint: ">=1.4.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-profile-development
  domains:
    allocationMode: ExplicitAllowlist
    allowedDomains:
      - development.example.invalid
      - production.example.invalid
      - restricted.example.invalid
    allowedSuffixes: []
  authProfiles:
    - name: organization-standard
      methods:
        - name: builtin
          type: BuiltInKeycloak
          providerID: builtin-keycloak
          enabled: true
          realm: kamiwaza
          clientID: kamiwaza-platform
          clientSecretRef:
            name: builtin-keycloak-client
            key: client-secret
      jitAdmission: Allowed
      requiredClaims:
        - sub
        - roles
        - tenant_id
      authorizationProjection: ReBACOnly
      tenantContext: RequiredClaimThenReBAC
      assurance:
        requiredACR:
          - urn:example:acr:multifactor
        requiredAMR:
          - pwd
          - otp
      session:
        overallTimeout: 12h
        inactivityTimeout: 30m
        reauthentication: StepUpForSensitiveAction
        tokenAudience: kamiwaza-platform
      failureMode: FailClosed
  transport:
    issuance:
      mode: PlatformIssued
      platformIssued:
        workloadIdentity:
          source: PlatformIssued
          trustDomain: organization.example.invalid
          attestation: OfflineTokenReview
          identityLifetime: 24h
          identityRenewBefore: 4h
    trust:
      bundleConfigMapName: kamiwaza-trust-bundle
      targetNamespaces:
        - kw-profile-development
        - kw-profile-production
        - kw-profile-restricted
      publicRoots: Include
      maximumBundleBytes: 900000
    floor:
      minimumTLSVersion: TLS1.2
      hostnameVerification: Required
    edge:
      listenerCertificate: PlatformIssued
      listenerCertificateSecretName: kamiwaza-gateway-tls
      httpsRedirect: RequireWhenSupported
      backendTLS: RequireWhenSupported
      clientCertificate:
        mode: Disabled
    internal:
      defaultTransport: PlatformTLS
      workloadIngressFloor: true
    clientIdentities: []
    egress:
      deniedNetworks:
        - Loopback
        - LinkLocal
        - CloudMetadata
        - PrivateRanges
      destinations: []
      proxies: []
