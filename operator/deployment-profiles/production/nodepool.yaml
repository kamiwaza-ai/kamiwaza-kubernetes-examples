apiVersion: platform.kamiwaza.io/v1alpha1
kind: KamiwazaNodePool
metadata:
  name: application-workers
  namespace: kw-profile-production
  labels:
    platform.kamiwaza.io/cluster: kamiwaza
spec:
  capability: applicationAPI
  replicas: 3
  placement:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: core-raycluster
            ray.io/node-type: worker
  disruption: { maxUnavailable: 1 }
