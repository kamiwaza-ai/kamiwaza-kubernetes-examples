apiVersion: v1
kind: ServiceAccount
metadata:
  name: profile-check
  namespace: kw-profile-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: profile-check
  namespace: kw-profile-production
rules:
  - apiGroups:
      - platform.kamiwaza.ai
    resources:
      - kamiwazaplatforms
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: profile-check
  namespace: kw-profile-production
subjects:
  - kind: ServiceAccount
    name: profile-check
    namespace: kw-profile-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: profile-check
---
apiVersion: batch/v1
kind: Job
metadata:
  name: profile-check
  namespace: kw-profile-production
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: profile-check
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command:
            - python
            - -c
          args:
            - |
              import json, os, ssl, urllib.request

              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ["KUBERNETES_SERVICE_PORT_HTTPS"]
              token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
              request = urllib.request.Request(
                  f"https://{host}:{port}/apis/platform.kamiwaza.ai/v1alpha1/namespaces/kw-profile-production/kamiwazaplatforms/kamiwaza",
                  headers={"Authorization": "Bearer " + token},
              )
              context = ssl.create_default_context(
                  cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              )
              platform = json.load(urllib.request.urlopen(request, context=context, timeout=10))
              spec = platform["spec"]
              conditions = platform.get("status", {}).get("conditions", [])
              assert spec["profile"] == "Full"
              assert spec["deletionPolicy"] == "RetainData"
              assert spec["components"]["metadataCatalog"]["enabled"] is True
              assert spec["observability"]["mode"] == "External"
              assert any(
                  c["type"] == "Ready"
                  and c["status"] == "True"
                  and c["observedGeneration"] == platform["metadata"]["generation"]
                  for c in conditions
              )
              print("production desired state and current-generation readiness verified")
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
