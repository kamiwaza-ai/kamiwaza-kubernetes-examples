# The transport policy the governed endpoint needs, with the fencing bound in
# it.
#
# One hop in this file decides whether the plane may be programmed at all:
# `ControlPlaneToProtocolDataPlane`. Configuration is authority-shaped --
# whoever can write it can reroute traffic -- so the channel that carries it
# is held to the same rules as any other authoritative commit target:
# per-replica mutual TLS, one monotonic fencing token at every commit, a
# signed revision digest, and a bounded last-known-good lifetime.
#
# The bound is `maxConnectionAge` on that hop, and it is not decorative. It is
# how long an already-admitted configuration may keep serving. Past it, the
# protected routes close rather than answering requests against authorization
# configuration nobody has confirmed is still current: an unreachable model is
# a smaller failure than an unauthorized answer. Where the hop expresses
# mutual TLS and states no connection age, the referenced client identity's
# validity is the bound instead. State nothing usable and the plane is blocked
# with `ConfigChannelUnauthenticated` before a single route is programmed --
# see unbounded-channel-refused.yaml.
#
# `ProtocolDataPlaneToDecisionService` is the other load-bearing hop. It
# carries the authorization answer for every request, so it is mutually
# authenticated, bounded, and fail-closed: unreachable or past its deadline
# means the request is denied with `DecisionServiceUnavailable` before any
# backend I/O happens, not answered on a stale opinion.
#
# No provider name, version, or native resource type appears anywhere in this
# file, and none appears in platform status either. The hop names describe
# roles.
transport:
  issuance:
    mode: PlatformIssued
    platformIssued:
      workloadIdentity:
        source: PlatformIssued
        trustDomain: kamiwaza-examples.example.com
        attestation: OfflineTokenReview
        # Short-lived per-replica identity. The plane's replicas each enroll
        # for their own, which is what makes a commit attributable to one
        # replica rather than to "the plane".
        identityLifetime: 24h
        identityRenewBefore: 8h

  trust:
    bundleConfigMapName: kamiwaza-trust-bundle
    publicRoots: Include
    targetNamespaces:
      - kamiwaza-examples

  floor:
    minimumTLSVersion: TLS1.2
    hostnameVerification: Required

  internal:
    defaultTransport: PlatformTLS
    workloadIngressFloor: true
    hops:
      # The configuration channel. 30m is the bounded last-known-good
      # lifetime: a configuration admitted now stops being served 30m from
      # now unless a fresh commit replaces it.
      - name: ControlPlaneToProtocolDataPlane
        transport: PlatformTLS
        authentication:
          type: MutualTLS
          maxConnectionAge: 30m
          mutualTLS:
            clientIdentityRef: control-plane-channel
      # The decision hop: mutually authenticated and per-identity verified.
      # Possession of an identity is never authority here -- the decision
      # service still decides every request -- but an unauthenticated decision
      # call would let anything that can reach it answer for the platform.
      - name: ProtocolDataPlaneToDecisionService
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityX509
          maxConnectionAge: 15m
          workloadIdentityX509:
            trustDomain: kamiwaza-examples.example.com
            acceptedIdentities:
              - "spiffe://kamiwaza-examples.example.com/ns/kamiwaza-examples/sa/kamiwaza-dataplane"
      # The gateway re-originating into the plane.
      - name: GatewayToProtocolDataPlane
        transport: PlatformTLS
        authentication:
          type: None
      # Upstream hops. An edge credential is never replayed here: every hop
      # authenticates independently with its own platform-issued identity.
      - name: ProtocolDataPlaneToServedModel
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityJWT
          maxConnectionAge: 30m
          workloadIdentityJWT:
            audience: kamiwaza-workload-sts
            attestationProfiles:
              - kubernetes-offline-v1
            ttlSeconds: 3600
      - name: ProtocolDataPlaneToUpstreamServer
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityJWT
          maxConnectionAge: 30m
          workloadIdentityJWT:
            audience: kamiwaza-workload-sts
            attestationProfiles:
              - kubernetes-offline-v1
            ttlSeconds: 3600
      # The plane's own state. Not application data, but it still reveals
      # topology, so it is protected rather than exempted.
      - name: ProtocolDataPlaneToStateStore
        transport: PlatformTLS
        authentication:
          type: MutualTLS
          maxConnectionAge: 30m
          mutualTLS:
            clientIdentityRef: dataplane-state
      # The direct path a served model keeps publishing. The plane is an
      # additional front door, not a replacement, so both paths can carry
      # traffic at once and each is reported on its own observation.
      - name: CoreToServedModel
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityJWT
          maxConnectionAge: 30m
          workloadIdentityJWT:
            audience: kamiwaza-workload-sts
            attestationProfiles:
              - kubernetes-offline-v1
            ttlSeconds: 3600

  clientIdentities:
    - name: control-plane-channel
      secretRef:
        name: kamiwaza-control-plane-channel
      commonName: control-plane-channel
      validity: 2160h
      renewBefore: 360h
    - name: dataplane-state
      secretRef:
        name: kamiwaza-dataplane-state
      commonName: dataplane-state
      validity: 2160h
      renewBefore: 360h

  egress:
    deniedNetworks:
      - Loopback
      - LinkLocal
      - CloudMetadata
      - PrivateRanges
