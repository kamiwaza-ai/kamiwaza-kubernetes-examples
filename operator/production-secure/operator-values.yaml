manager:
  watchNamespaces:
    - kw-production-secure
  watchAnyNamespace: false
adminPolicy:
  revision: kw-production-secure-r1
  allowedTargetNamespaces:
    - kw-production-secure
  storage:
    allowedClassNames:
      - example-rwo
      - absent-class
    allowedSharedClassNames: []
  routing:
    gateway:
      name: kamiwaza-gateway
      namespace: kw-production-secure
      sectionName: https
  trust:
    managementPolicy: CertManager
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-ca
    certificate:
      duration: 8760h
      renewBefore: 720h
      privateKey:
        algorithm: ECDSA
        size: 384
        encoding: PKCS8
        rotationPolicy: Always
    bundle:
      configMapName: kamiwaza-trust-bundle
      sourceSecretName: core-client-tls
      sourceKey: ca.crt
  images:
    requireDigests: true
    allowedRepositoryPrefixes:
      - ghcr.io/kamiwaza-internal/
      - ghcr.io/authzed/
      - ghcr.io/agentgateway/
    pullSecretNames:
      - registry-pull
  modelRegistry:
    type: OCIRegistry
    endpoint: registry.kw-production-secure.svc.cluster.local:5000
    credentialSecretName: kamiwaza-registry-credentials
    usernameKey: username
    passwordKey: password
  metadataCatalog:
    provider: DataHub
  observability:
    allowedModes: [Disabled, External]
    approvedSinks:
      - name: production-otel
        endpoint: https://telemetry.example.invalid:4318
        protocol: http/protobuf
    monitoring:
      enabled: true
      provider: PrometheusOperator
  operations:
    adoptionAllowed: false
    deleteAllAllowed: false
    genericSecretRotationAllowed: false
    approvedForwardOnlyUpgradeTargets:
      - 1.3.0
  extensions:
    enabled: true
    allowedNamespaces:
      - kw-production-secure
    allowNamespaceCreation: false
    allowCrossNamespaceResources: false
    hostDiscovery: Disabled
    sandbox: Disabled
    dynamicRBAC: Disabled
  dependencies:
    certManager:
      managementPolicy: External
      versionConstraint: ">=1.20.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: cert-manager
    trustManager:
      managementPolicy: External
      versionConstraint: ">=0.22.0 <1.0.0"
      evidenceSource: AdminAttested
      namespace: kw-production-secure
    routing:
      managementPolicy: External
      versionConstraint: ">=1.28.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-production-secure
    gatewayAPI:
      managementPolicy: External
      versionConstraint: ">=1.4.0 <2.0.0"
      evidenceSource: AdminAttested
      namespace: kw-production-secure
  domains:
    allocationMode: ExplicitAllowlist
    allowedDomains:
      - secure.example.invalid
    allowedSuffixes: []
  transport:
    issuance:
      mode: PlatformIssued
      platformIssued:
        authorityValidity: 8760h
        authorityRenewBefore: 720h
        leafValidity: 2160h
        leafRenewBefore: 360h
        expirationPolicy: ReplaceKey
        privateKeyPolicy:
          algorithm: ECDSA
          size: 384
          rotationPolicy: Always
        workloadIdentity:
          source: PlatformIssued
          trustDomain: secure.example.invalid
          attestation: OfflineTokenReview
          identityLifetime: 24h
          identityRenewBefore: 8h
    trust:
      bundleConfigMapName: kamiwaza-trust-bundle
      publicRoots: Include
      maximumBundleBytes: 900000
      targetNamespaces: [kw-production-secure]
    floor:
      minimumTLSVersion: TLS1.2
      hostnameVerification: Required
    edge:
      listenerCertificate: PlatformIssued
      listenerCertificateSecretName: kamiwaza-gateway-tls
      httpsRedirect: RequireWhenSupported
      backendTLS: RequireWhenSupported
    internal:
      defaultTransport: PlatformTLS
      workloadIngressFloor: true
    egress:
      deniedNetworks: [Loopback, LinkLocal, CloudMetadata, PrivateRanges]
  authProfiles:
    - name: production
      methods:
        - name: builtin
          type: BuiltInKeycloak
          providerID: builtin-keycloak
          enabled: true
          realm: kamiwaza
          clientID: kamiwaza-platform
      jitAdmission: PreAdmissionRequired
      requiredClaims: [sub]
      authorizationProjection: ReBACOnly
      tenantContext: RequiredClaimThenReBAC
      assurance: {}
      session:
        overallTimeout: 8h
        inactivityTimeout: 15m
        reauthentication: StepUpForSensitiveAction
        tokenAudience: kamiwaza-platform
      failureMode: FailClosed
