apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-policy-check
  namespace: kw-production-secure
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-policy-check
  namespace: kw-production-secure
rules:
  - apiGroups:
      - platform.kamiwaza.io
    resources:
      - kamiwazaplatforms
    resourceNames:
      - kamiwaza
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-policy-check
  namespace: kw-production-secure
subjects:
  - kind: ServiceAccount
    name: platform-policy-check
    namespace: kw-production-secure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-policy-check
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-policy-check
  namespace: kw-production-secure
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: platform-policy-check
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: docker.io/library/python@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
          command:
            - python
            - -c
          args:
            - |
              import json, os, ssl, time, urllib.request

              token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
              ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              url = "https://kubernetes.default.svc/apis/platform.kamiwaza.io/v1alpha1/namespaces/kw-production-secure/kamiwazaplatforms/kamiwaza"
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              for attempt in range(60):
                  with urllib.request.urlopen(
                      request, context=ssl.create_default_context(cafile=ca), timeout=10
                  ) as response:
                      platform = json.load(response)
                  conditions = {
                      item["type"]: item for item in platform.get("status", {}).get("conditions", [])
                  }
                  ready = conditions.get("Ready", {})
                  if (
                      ready.get("status") == "True"
                      and ready.get("observedGeneration") == platform["metadata"]["generation"]
                  ):
                      break
                  if attempt == 59:
                      raise SystemExit(("platform not current and Ready", ready))
                  time.sleep(min(1 + attempt // 5, 10))
              spec = platform["spec"]
              assert spec["deletionPolicy"] == "RetainData"
              assert spec["observability"] == {
                  "mode": "External",
                  "sinkRef": {"name": "production-otel"},
              }
              assert all("@sha256:" in pin["reference"] for pin in spec["images"]["pinned"])
              assert spec["components"]["identityAndAccess"]["profileRef"]["name"] == "production"
              print(
                  json.dumps(
                      {
                          "readyReason": ready["reason"],
                          "observedGeneration": ready["observedGeneration"],
                      }
                  )
              )
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
