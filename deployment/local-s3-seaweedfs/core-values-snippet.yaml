# Merge into deploy/cluster/values/overrides.yaml. Replace any existing
# `core.context.objectStorage` block with this one.
#
# endpointUrl points at the in-cluster SeaweedFS Service created by
# seaweedfs.yaml (namespace `kamiwaza-system`, Service `seaweed-s3`).
# Region must be a valid AWS-style region string; SeaweedFS doesn't enforce
# it, but botocore validates the format on the client side. `us-east-1` is
# the most compatible default.
#
# credentialsSecretRef points at the `core-s3` secret in namespace `kamiwaza`
# (see core-s3-secret.yaml). The chart wires these into
# CONTEXT_SERVICE_S3_{ACCESS_KEY_ID,SECRET_ACCESS_KEY} on core-scheduler and
# the core-raycluster head pod.

core:
  context:
    objectStorage:
      endpointUrl: "http://seaweed-s3.kamiwaza-system.svc.cluster.local:8333"
      defaultBucket: "kz-workroom"
      defaultRegion: "us-east-1"
      defaultPrefix: "context/raw"
      credentialsSecretRef:
        name: "core-s3"
        accessKeyIdKey: "access_key_id"
        secretAccessKeyKey: "secret_access_key"
