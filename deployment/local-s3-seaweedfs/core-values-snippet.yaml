# Merge into deploy/cluster/values/overrides.yaml (Helmfile merges overrides last).
# Replace any existing `core.context.objectStorage` block with this one.
#
# The endpointUrl points at the in-cluster SeaweedFS S3 Service created by
# the seaweedfs Helm release (namespace `seaweedfs`, see the local-s3-
# seaweedfs scenario README). The credentialsSecretRef points at the
# `core-s3` secret in namespace `kamiwaza` — the SeaweedFS release mirrors
# its admin credentials into that secret, so no manual `kubectl create
# secret core-s3` step is needed in this mode.

core:
  context:
    objectStorage:
      defaultBucket: "kz-workroom"
      defaultRegion: "us-east-1"
      defaultPrefix: "context/raw"
      endpointUrl: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
      credentialsSecretRef:
        name: "core-s3"
        accessKeyIdKey: "access_key_id"
        secretAccessKeyKey: "secret_access_key"
