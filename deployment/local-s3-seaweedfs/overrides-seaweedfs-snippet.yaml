# Drop in as deploy/cluster/values/overrides-seaweedfs.yaml.
# Loaded by the seaweedfs release (only when KAMIWAZA_LOCAL_S3_ENABLED=true
# at helmfile time). The chart fails closed if either field is blank.
#
# The same credentials are mirrored into the kamiwaza/core-s3 secret by the
# seaweedfs release, so the consumer side (core) does not need a separate
# manual secret-create step.
#
# Generate fresh credentials with either of these (do NOT reuse the example
# values — they are placeholders, not secure defaults):
#
#   # Access key id: 20-char uppercase alphanumeric, AWS-style shape.
#   LC_ALL=C tr -dc 'A-Z0-9' </dev/urandom | head -c 20; echo
#
#   # Secret access key: 43-char URL-safe random (256 bits of entropy).
#   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
#
# Paste each output into the matching field below.

auth:
  accessKeyId: "REPLACE-WITH-OUTPUT-OF-tr-COMMAND-ABOVE"
  secretAccessKey: "REPLACE-WITH-OUTPUT-OF-openssl-COMMAND-ABOVE"

# Optional tunables (defaults shown).
# bucket:
