---
# Mirrors the SeaweedFS admin credentials into the namespace where core-scheduler
# (and the core-raycluster Ray Serve replicas) consume them. The chart's
# scheduler deployment references this Secret by name via
# `core.context.objectStorage.credentialsSecretRef.name`.
#
# Field names match `credentialsSecretRef.{accessKeyIdKey,secretAccessKeyKey}`
# in core-values-snippet.yaml. Replace ${ACCESS_KEY} / ${SECRET_KEY} with the
# SAME values used in seaweedfs.yaml — these are not separate credentials.

apiVersion: v1
kind: Secret
metadata:
  name: core-s3
  namespace: kamiwaza
type: Opaque
stringData:
  access_key_id: "${ACCESS_KEY}"
  secret_access_key: "${SECRET_KEY}"
