apiVersion: v1
kind: Secret
metadata:
  name: traefik-client-ca
  namespace: kamiwaza
type: Opaque
stringData:
  # PEM-encoded CA cert(s) trusted for client cert authentication at Traefik.
  # Keep as single-line literal block.
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CA_PEM
    -----END CERTIFICATE-----
