# Rotation and drain, as policy.
#
# Two fields carry the whole drain contract, and neither looks like it:
#
#   authentication.maxConnectionAge   how long a connection authenticated by
#                                     one certificate may live
#   clientIdentities[].validity       how long that certificate lives
#
# The platform refuses a policy whose connection age exceeds the credential
# lifetime, because a connection older than its certificate is a session whose
# peer identity was last proven by material that has since expired. The
# enforced ceiling is never above the *remaining* lifetime either, so a
# certificate close to expiry shortens the connections it authenticated rather
# than the other way round.
#
# `ReplaceKey` selects the three-phase rotation: trust the new anchor, issue
# under it, then drop the retired anchor once every consumer is proven to be
# on the new generation. The retired anchor is never dropped on a timer, and
# rotation revokes nothing.
transport:
  issuance:
    mode: PlatformIssued
    platformIssued:
      authorityValidity: 8760h
      authorityRenewBefore: 720h
      leafValidity: 2160h
      leafRenewBefore: 360h
      # The three-phase protocol. RenewCertificate would reissue the authority
      # certificate over the existing key and cost one rollout instead.
      expirationPolicy: ReplaceKey
      privateKeyPolicy:
        algorithm: ECDSA
        size: 384
        # A new key on every renewal, which is what makes ReplaceKey the
        # honest default for this policy.
        rotationPolicy: Always
      workloadIdentity:
        source: PlatformIssued
        trustDomain: kamiwaza-examples.example.com
        attestation: OfflineTokenReview
        # Short-lived by design: the shorter the identity, the smaller the
        # window a compromised one is useful in, and the drain arithmetic
        # below is bounded by it.
        identityLifetime: 24h
        identityRenewBefore: 8h
    # Renewal and the rollouts it causes are confined to this window. Manual
    # force-renewal is window-gated too.
    maintenanceWindows:
      - "0 2 * * 6"

  trust:
    bundleConfigMapName: kamiwaza-trust-bundle
    publicRoots: Include
    targetNamespaces:
      - kamiwaza-examples

  floor:
    minimumTLSVersion: TLS1.2
    hostnameVerification: Required

  internal:
    defaultTransport: PlatformTLS
    workloadIngressFloor: true
    hops:
      # 30m of connection age against 2160h of certificate: the ceiling is the
      # declared age, and the drain window is one ceiling long.
      - name: CoreToApplicationDatabase
        transport: PlatformTLS
        authentication:
          type: MutualTLS
          maxConnectionAge: 30m
          mutualTLS:
            clientIdentityRef: core-client
      - name: CoreToKeyValueStore
        transport: PlatformTLS
        authentication:
          type: MutualTLS
          maxConnectionAge: 30m
          mutualTLS:
            clientIdentityRef: core-client
      # A token-bearing hop. The bound here is still the connection's, not the
      # token's: a token is re-fetched inside a live connection, while the
      # certificate presented in the handshake is fixed for its whole life.
      - name: CoreToServedModel
        transport: PlatformTLS
        authentication:
          type: WorkloadIdentityJWT
          maxConnectionAge: 30m
          workloadIdentityJWT:
            audience: kamiwaza-workload-sts
            attestationProfiles:
              - kubernetes-tokenreview-v1
              - kubernetes-offline-v1
            ttlSeconds: 3600

  clientIdentities:
    - name: core-client
      secretRef:
        name: kamiwaza-core-client
      commonName: core-client
      validity: 2160h
      renewBefore: 360h

  egress:
    deniedNetworks:
      - Loopback
      - LinkLocal
      - CloudMetadata
      - PrivateRanges
