# Builds ConfigMap consent-configmap from consent.html (key must stay consent.html
# to match core.scheduler extraVolumes in core-values-snippet.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kamiwaza

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: consent-configmap
    files:
      - consent.html
