# BYO ingress TLS Secret.
#
# PREFERRED: create from files so no key material is ever pasted into YAML
# (and so this repo's detect-private-key hook never trips):
#
#   kubectl -n kamiwaza create secret tls org-ingress-tls \
#     --cert=/path/to/fullchain.pem \
#     --key=/path/to/privkey.pem
#
# If you must use a manifest, fill the placeholders below from your PEM files.
# tls.crt = leaf (ideally fullchain) issued by your CA for *.<your-domain>.
# tls.key = the matching private key (PEM). Do NOT commit the filled-in file.
apiVersion: v1
kind: Secret
metadata:
  name: org-ingress-tls
  namespace: kamiwaza
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_INGRESS_LEAF_FULLCHAIN_PEM
    -----END CERTIFICATE-----
  # Paste the PEM private key here (the full block including its BEGIN/END lines).
  tls.key: |
    REPLACE_WITH_INGRESS_PRIVATE_KEY_PEM_INCLUDING_BEGIN_END_LINES
