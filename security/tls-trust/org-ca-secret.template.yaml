apiVersion: v1
kind: Secret
metadata:
  name: kamiwaza-org-ca
  namespace: kamiwaza
type: Opaque
stringData:
  # Enterprise / corporate CA chain trusted for OUTBOUND TLS (Bedrock, HF mirror, registries).
  # A single key may hold root + intermediate(s) concatenated — the trust-manager
  # Bundle uses includeAllKeys: true, so every key in this Secret is included.
  # Add more keys (e.g. partner-ca.pem) as needed.
  org-ca.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_ROOT_CA_PEM
    -----END CERTIFICATE-----
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_INTERMEDIATE_CA_PEM
    -----END CERTIFICATE-----
