apiVersion: v1
kind: Secret
metadata:
  name: kamiwaza-org-ca
  namespace: kamiwaza
type: Opaque
stringData:
  # Enterprise / corporate CA chain trusted for OUTBOUND TLS (Bedrock, HF mirror, registries).
  # Optional input source for build-trust-bundle-configmap.sh: if you do NOT pass
  # --ca-file <pem>, the script reads ALL keys of this Secret as the corporate CA chain.
  # A single key may hold root + intermediate(s) concatenated, and you may add more
  # keys (e.g. partner-ca.pem) as needed.
  org-ca.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_ROOT_CA_PEM
    -----END CERTIFICATE-----
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_INTERMEDIATE_CA_PEM
    -----END CERTIFICATE-----
