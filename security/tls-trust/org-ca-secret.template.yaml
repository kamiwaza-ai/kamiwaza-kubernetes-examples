# Reference shape only. Do not put real certificate material in this tracked
# file. Prefer kustomization.yaml with the Git-ignored local-secrets directory.
apiVersion: v1
kind: Secret
metadata:
  name: kamiwaza-org-ca
  # Administrator-owned trust sources live in the manager namespace.
  namespace: kamiwaza-system
type: Opaque
stringData:
  # Root and intermediate certificates in leaf-to-root order. Certificate
  # material only; private keys are refused by the operator.
  org-ca.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REVIEWED_CA_CHAIN
    -----END CERTIFICATE-----
