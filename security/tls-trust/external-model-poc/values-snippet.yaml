# Trial / proof-of-concept ONLY: skip TLS verification for external model hosts.
#
# Kamiwaza 1.4 and later. Merge into your site values file. Off by default.
#
# RISK (it is in the name): without verification, Kamiwaza sends the API keys it
# holds for that provider to whoever answers DNS for the host or sits on the
# network path (DNS retargeting). For anything you keep, add the provider's CA to
# global.trust.extraAnchors (see ../README.md) and delete this setting.
#
# This is separate from core.scheduler.tlsInsecure, which covers only the
# platform's own origins and never an external model host. From 1.4 it is the
# only setting that relaxes an external model host.
#
# Extensions (e.g. Kaizen) pick up a change, on OR off, only when redeployed.
# Plain http:// endpoints have no TLS and are unaffected.

core:
  scheduler:
    # Default (verify every external host):
    #   externalTlsInsecureWithDnsRetargetingRisk: false
    #
    # Broadest form: every external model host (also covers IPv6 literals and,
    # in Core only, short hostnames; Kaizen never relaxes a short hostname):
    #   externalTlsInsecureWithDnsRetargetingRisk: true
    #
    # Narrowest form (below): exact, fully qualified hostnames (at least one
    # dot) or IPv4 addresses. No wildcards, subdomain matching, scheme, port,
    # path, single-label names, or IPv6 literals (the chart refuses those at
    # render time).
    externalTlsInsecureWithDnsRetargetingRisk:
      - models.example.com
