apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Administrator-owned trust sources live in the operator manager namespace.
# Change this value when the manager uses another namespace.
namespace: kamiwaza-system

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: kamiwaza-org-ca
    files:
      # Root and intermediate certificates in leaf-to-root order. The local
      # file is ignored by Git and must contain certificates only.
      - org-ca.pem=local-secrets/org-ca.pem
