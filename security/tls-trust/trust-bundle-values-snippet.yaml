# Custom CA trust recipe — merge into Deploy `cluster/values/overrides.yaml`
# (or another higher-priority values file).
#
# This recipe is CONFIG-ONLY and needs NO trust-manager controller.
#
# Prereqs before sync:
#   - The `kamiwaza-trust-bundle` ConfigMap has been built + applied by
#     `build-trust-bundle-configmap.sh` (it assembles the additive PEM and writes
#     the ConfigMap to ns kamiwaza / kamiwaza-system / kamiwaza-extensions).
#     That script is the config-only replacement for the trust-manager controller.
#   - The customer CA source the script reads exists: a local PEM (`--ca-file`)
#     or Secret `kamiwaza-org-ca` in ns `kamiwaza`.
#
# Effect (additive): public/Mozilla CAs + platform root-ca + your CA(s) are merged
# into ConfigMap `kamiwaza-trust-bundle` (key `ca-certificates.crt`) by the script,
# then mounted on scheduler + Ray at /etc/ssl/certs/ca-certificates.crt by the
# Helm value below.

# --- ca subchart: do NOT use the trust-manager Bundle path --------------------
ca:
  trustBundle:
    # No trust-manager controller in this recipe, so the chart's Bundle CR has
    # nothing to reconcile it. Disable it so a dead/inert Bundle CR is not
    # rendered on every sync. (The ConfigMap is produced by the build script,
    # not by this CR.) The build script — not `targetNamespaces` — controls
    # which namespaces receive the ConfigMap.
    enabled: false
    # NOTE: intentionally NO `customerCASecret` here. That key only feeds the
    # trust-manager Bundle CR (disabled above); the customer CA is fed to the
    # build script via `--ca-file` or the `kamiwaza-org-ca` Secret instead.

# --- core subchart: mount the bundle + set client-library trust env ----------
core:
  # This gate mounts the `kamiwaza-trust-bundle` ConfigMap on scheduler + Ray.
  # The name is a legacy misnomer: it only mounts a ConfigMap — it does NOT
  # require the trust-manager controller. Keep it enabled.
  # (Aside: the top-level `trustManager:` key in kamiwaza-base.yaml is a no-op —
  # the core subchart never reads it. Set it here under `core`.)
  trustManager:
    enabled: true

  scheduler:
    # Consumed by BOTH the scheduler Deployment and the Ray head/worker pods
    # (both read `scheduler.extraEnv`). This is where Bedrock/LiteLLM runs.
    extraEnv:
      # SSL_CERT_FILE is the key lever for the Bedrock/LiteLLM path. In litellm 1.83
      # Bedrock is httpx-based (not boto3): get_ssl_verify() returns $SSL_CERT_FILE when
      # verification is on, and httpx 0.28 create_ssl_context() uses $SSL_CERT_FILE as the
      # CA file when set (else certifi). Also covers stdlib ssl and the OpenSSL CLI.
      # Point it at the ADDITIVE bundle so public TLS still works (SSL_CERT_FILE replaces
      # certifi, it does not augment it).
      - name: SSL_CERT_FILE
        value: "/etc/ssl/certs/ca-certificates.crt"
      # AWS_CA_BUNDLE only matters for DIRECT boto3 use (S3, STS) — litellm's Bedrock
      # call does not use boto3. Harmless to set; covers those direct paths.
      - name: AWS_CA_BUNDLE
        value: "/etc/ssl/certs/ca-certificates.crt"
      # REQUESTS_CA_BUNDLE is already set to this path by the chart (requests path).

    # --- FALLBACK ONLY (rarely needed): certifi overlay --------------------------
    # NOT needed for httpx >= 0.28 / litellm 1.83 — they honor SSL_CERT_FILE above.
    # Use this only for a client that pins certifi.where() AND ignores SSL_CERT_FILE.
    # Overlays the trust-bundle ConfigMap onto the venv's certifi cacert.pem.
    #
    # 1) Find the exact path in the pod:
    #      kubectl -n kamiwaza exec deploy/core-scheduler -c core -- \
    #        python -c "import certifi; print(certifi.where())"
    # 2) Set mountPath + subPath below to that path, then uncomment both blocks.
    #
    # extraVolumes:
    #   - name: certifi-overlay
    #     configMap:
    #       name: kamiwaza-trust-bundle
    #       items:
    #         - key: ca-certificates.crt
    #           path: cacert.pem
    #       optional: true
    # extraVolumeMounts:
    #   - name: certifi-overlay
    #     mountPath: /app/.venv/lib/python3.11/site-packages/certifi/cacert.pem  # <-- REPLACE with `certifi.where()`
    #     subPath: cacert.pem
    #     readOnly: true
