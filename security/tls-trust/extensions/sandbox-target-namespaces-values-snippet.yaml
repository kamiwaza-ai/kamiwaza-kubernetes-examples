# Extension / Kaizen follow-on: covering the sandbox namespace (kamiwaza-sandboxes).
#
# NO VALUES CHANGE IS NEEDED ANYMORE.
#
# This file used to set `ca.trustBundle.targetNamespaces` to a 4-namespace list
# (adding kamiwaza-sandboxes) so that trust-manager would replicate the
# `kamiwaza-trust-bundle` ConfigMap into the sandbox namespace. trust-manager is
# no longer used, and that values key is now INERT — it only ever fed the
# (now-disabled) trust-manager Bundle CR.
#
# Instead, the build script assembles and applies the ConfigMap directly. To
# cover the Kaizen sandbox namespace, run the build script with
# `--include-sandboxes`:
#
#   security/tls-trust/build-trust-bundle-configmap.sh --ca-file <pem> --include-sandboxes
#
# That writes the `kamiwaza-trust-bundle` ConfigMap to `kamiwaza-sandboxes` in
# addition to the three defaults (kamiwaza, kamiwaza-system, kamiwaza-extensions).
#
# The pod/CR mount contract is unchanged: mount the `kamiwaza-trust-bundle`
# ConfigMap at /etc/ssl/certs/ca-certificates.crt.
#
# This file is intentionally comment-only; it is kept so existing references
# still resolve.
#
# Parent packet reference:
#   security/tls-trust/trust-bundle-values-snippet.yaml
