# Example ReBAC *bootstrap* manifest for a second tenant (`acme-lab`).
#
# Copy into the Kamiwaza application repo as:
#   configs/rebac/tenants/acme-lab.yaml
# (or mount the same content into the scheduler pod — see README.)
#
# Schema matches `kamiwaza.services.auth.bootstrap.load_manifest`:
#   - tenant: stable id (must match JWT `tenant_id` / `tenant` claim when that user logs in)
#   - defaults: optional subject_namespace / resource_type for all tuples
#   - tuples: subject, resource_id, relation (+ optional resource_type, subject_namespace, tenant_id)
# Placeholders: ${TENANT_ID} in any string is replaced with the manifest `tenant` value.
#
# Before applying in production: run policy validation in the kamiwaza repo:
#   PYTHONPATH=. python scripts/rebac_policy.py validate configs/rebac/policies

tenant: acme-lab
defaults:
  subject_namespace: user
  resource_type: system
tuples:
  # Platform admin user (Keycloak username) owns bootstrap scope for this tenant.
  - subject: admin
    resource_id: "bootstrap:${TENANT_ID}"
    relation: owner
