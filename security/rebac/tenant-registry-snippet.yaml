# The list of tenant ids this installation admits.
#
# This is not a grant. It registers which `tenant_id` claims exist; who may
# reach which resource inside a tenant is a bundle entry with
# `resourceType: Tenant`, planned and applied through grant-change.sh. See
# README.md § Tenants.
#
# Merge into `configs/rebac/tenant_registry.yaml` in the Kamiwaza application
# repository. Keep `__default__` unless you know this installation does not
# need it: the loader re-adds it when it is missing, so removing it here
# changes nothing.
#
# The file is not applied with `kubectl apply`. It is read from
# `KAMIWAZA_ROOT/configs/rebac/tenant_registry.yaml` inside the running image,
# or from `AUTH_TENANT_REGISTRY_PATH` when that points at a mounted file. An
# edit that reaches neither place changes nothing at runtime.
#
# Read by `kamiwaza.services.authz.tenant_registry`, which enforces the list
# only when `AUTH_TENANT_REGISTRY_ENFORCED=true`
# (tenant-registry-enforcement-snippet.yaml). Every value below is a
# placeholder.
tenants:
  - id: "__default__"
    name: "Default Tenant"
    description: "Bootstrap tenant for single-tenant and development installs"
  - id: "example-lab"
    name: "Example Lab"
    description: "Placeholder second tenant"
