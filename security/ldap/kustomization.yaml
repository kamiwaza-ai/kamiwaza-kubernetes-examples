# Read-only directory federation lab for Kamiwaza operators.
# See README.md and docs/OPERATOR_GUIDE.md.
#
# Apply order (resources list):
#   1. namespace ldap
#   2. openldap — bootstrap ConfigMap, storage, workload, Service
#   3. jobs — directory bootstrap, which also creates the read-only bind
#      account and sets the lab passwords from the generated Secret
#
# Every image in this example is pinned by digest. Every credential is
# generated locally into `local-secrets/`, which Git ignores; no password,
# hash, or bind credential is carried in this repository.
#
#   mkdir -p security/ldap/local-secrets
#   for name in admin-password config-password federation-bind-password demo-user-password; do
#     openssl rand -hex 32 > "security/ldap/local-secrets/${name}"
#   done
#   kubectl apply -k security/ldap
#
# Hex, not base64: these values are written into LDIF, where a value starting
# with a space or a colon has to be base64-encoded to be read back correctly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      kamiwaza.ai/example: ldap-keycloak-federation

resources:
  - namespace.yaml
  - openldap/configmap.yaml
  - openldap/pvc.yaml
  - openldap/pvc-config.yaml
  - openldap/deployment.yaml
  - openldap/service.yaml
  - jobs/ldap-bootstrap-job.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: openldap-secret
    namespace: ldap
    files:
      - admin-password=local-secrets/admin-password
      - config-password=local-secrets/config-password
      # The bind credential the directory federation uses. It belongs to
      # cn=federation-reader, which the default directory access control
      # grants read and no write, so a compromised federation credential
      # cannot modify the directory.
      - federation-bind-password=local-secrets/federation-bind-password
      # One password for the lab users, set by the bootstrap Job. Lab only.
      - demo-user-password=local-secrets/demo-user-password
