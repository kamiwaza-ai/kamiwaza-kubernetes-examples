# Traefik runs in kamiwaza with namespaced CRD RBAC; IngressRoute must live there.
# Cross-namespace backend refs require allowCrossNamespace (not enabled on this stack);
# instead we route to Service ldap-ui-proxy (ExternalName → ldap-ui.ldap.svc.cluster.local).
#
# Host must match ldap-ui/deployment.yaml env SERVER_HOSTNAME (and DNS *.kamiwaza.test).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ldap-ui
  namespace: kamiwaza
  labels:
    app.kubernetes.io/name: ldap-ui
    app.kubernetes.io/part-of: kamiwaza-kubernetes-examples
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ldap-ui.kamiwaza.test`)
      kind: Rule
      middlewares:
        - name: ldap-ui-headers
        - name: ldap-ui-account-manager-slash
      services:
        - name: ldap-ui-proxy
          port: 80
