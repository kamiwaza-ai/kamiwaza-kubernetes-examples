# Lab directory content: the tree, the service branch the read-only bind
# account lives in, three users, and two groups.
#
# No password appears here. The bootstrap Job sets the lab user passwords and
# the federation bind credential from Secret `openldap-secret`, so a
# credential is never carried in a tracked file.
#
# Every value is a synthetic lab value: `dc=kamiwaza,dc=local` is the stock
# example base DN and `users.example.invalid` is a reserved non-resolvable
# domain (RFC 6761). Replace both, along with the users, for anything real.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-bootstrap
  namespace: ldap
data:
  bootstrap.ldif: |
    dn: ou=people,dc=kamiwaza,dc=local
    objectClass: organizationalUnit
    ou: people

    dn: ou=groups,dc=kamiwaza,dc=local
    objectClass: organizationalUnit
    ou: groups

    dn: ou=services,dc=kamiwaza,dc=local
    objectClass: organizationalUnit
    ou: services

    dn: uid=alice,ou=people,dc=kamiwaza,dc=local
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: alice
    cn: Alice Administrator
    givenName: Alice
    sn: Administrator
    displayName: Alice Administrator
    mail: alice@users.example.invalid
    uidNumber: 1001
    gidNumber: 1001
    homeDirectory: /home/alice

    dn: uid=bob,ou=people,dc=kamiwaza,dc=local
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: bob
    cn: Bob User
    givenName: Bob
    sn: User
    displayName: Bob User
    mail: bob@users.example.invalid
    uidNumber: 1002
    gidNumber: 1002
    homeDirectory: /home/bob

    dn: uid=carol,ou=people,dc=kamiwaza,dc=local
    objectClass: inetOrgPerson
    objectClass: posixAccount
    uid: carol
    cn: Carol Engineer
    givenName: Carol
    sn: Engineer
    displayName: Carol Engineer
    mail: carol@users.example.invalid
    uidNumber: 1003
    gidNumber: 1003
    homeDirectory: /home/carol

    dn: cn=admin,ou=groups,dc=kamiwaza,dc=local
    objectClass: groupOfNames
    objectClass: extensibleObject
    cn: admin
    member: uid=alice,ou=people,dc=kamiwaza,dc=local
    memberUid: alice

    dn: cn=user,ou=groups,dc=kamiwaza,dc=local
    objectClass: groupOfNames
    objectClass: extensibleObject
    cn: user
    member: uid=alice,ou=people,dc=kamiwaza,dc=local
    member: uid=bob,ou=people,dc=kamiwaza,dc=local
    member: uid=carol,ou=people,dc=kamiwaza,dc=local
    memberUid: alice
    memberUid: bob
    memberUid: carol
