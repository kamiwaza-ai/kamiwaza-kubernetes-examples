apiVersion: v1
kind: Secret
metadata:
  name: openldap-secret
  namespace: ldap
type: Opaque
stringData:
  # Must match Keycloak bind secret (jobs/keycloak-ldap-bind-secret.yaml) for federation.
  # Demo default aligns with sample users in ldap-samples/bootstrap.ldif (userPassword: kamiwaza).
  # Replace before any shared or production cluster.
  admin-password: "kamiwaza"
  config-password: "kamiwaza"
