# Lab stand-in for a directory the customer owns. Plaintext LDAP on the
# cluster network, one replica, one writable volume: a teaching directory, not
# a production one.
#
# The image is pinned by digest. The tag is kept beside it for readability;
# the digest is what is resolved.
#
# There is no bootstrap init container. The directory content is loaded once
# by the ldap-bootstrap-import Job, so there is one writer of the tree instead
# of two racing at start-up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: ldap
  labels:
    app: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  # LDAP with a single writable PVC should be recreated, not rolled.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: docker.io/osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
          ports:
            - containerPort: 389
              name: ldap
          env:
            - name: LDAP_ORGANISATION
              value: "Kamiwaza"
            - name: LDAP_DOMAIN
              value: "kamiwaza.local"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap-secret
                  key: admin-password
            - name: LDAP_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap-secret
                  key: config-password
            # Lab only. A directory this example federates for real is
            # reached over ldaps:// or StartTLS, which this lab does not
            # serve; see README.md.
            - name: LDAP_TLS
              value: "false"
            - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
              value: "false"
          volumeMounts:
            - name: ldap-data
              mountPath: /var/lib/ldap
            - name: ldap-config
              mountPath: /etc/ldap/slapd.d
          readinessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: ldap-data
          persistentVolumeClaim:
            claimName: openldap-data
        - name: ldap-config
          persistentVolumeClaim:
            claimName: openldap-config
