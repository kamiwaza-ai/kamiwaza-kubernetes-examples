apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: ldap
  labels:
    app: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  # LDAP with a single writable PVC should be recreated, not rolled.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openldap
    spec:
      initContainers:
        - name: copy-bootstrap-ldif
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp /bootstrap-config/bootstrap.ldif /bootstrap-work/bootstrap.ldif
          volumeMounts:
            - name: bootstrap-config
              mountPath: /bootstrap-config
            - name: bootstrap-work
              mountPath: /bootstrap-work
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          ports:
            - containerPort: 389
              name: ldap
          env:
            - name: LDAP_ORGANISATION
              value: "Kamiwaza"
            - name: LDAP_DOMAIN
              value: "kamiwaza.local"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap-secret
                  key: admin-password
            - name: LDAP_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap-secret
                  key: config-password
            - name: LDAP_TLS
              value: "false"
            - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
              value: "false"
          volumeMounts:
            - name: ldap-data
              mountPath: /var/lib/ldap
            - name: ldap-config
              mountPath: /etc/ldap/slapd.d
            - name: bootstrap-work
              mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom
          readinessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: ldap-data
          persistentVolumeClaim:
            claimName: openldap-data
        - name: ldap-config
          persistentVolumeClaim:
            claimName: openldap-config
        - name: bootstrap-config
          configMap:
            name: openldap-bootstrap
        - name: bootstrap-work
          emptyDir: {}
