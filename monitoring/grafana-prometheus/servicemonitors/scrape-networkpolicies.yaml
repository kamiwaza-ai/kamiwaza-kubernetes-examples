# The PostgreSQL exporter (`exporters/`) runs beside the database in the
# platform namespace and dials it directly. Only that exporter is admitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-exporter-durable-data
  namespace: kamiwaza
  labels:
    app.kubernetes.io/part-of: kamiwaza
    app.kubernetes.io/component: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: core-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-postgres-exporter
      ports:
        - port: 5432
          protocol: TCP
