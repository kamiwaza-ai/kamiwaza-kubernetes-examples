# Scrape the platform's coordination store.
#
# The operator starts etcd with a plaintext metrics listener on 8080 and names
# it `etcd-metrics` on the headless `core-etcd` Service, so every member is
# scraped individually. Client and peer traffic stay on their mutually
# authenticated ports; Prometheus needs no etcd credential.
#
# `scrape-networkpolicies.yaml` admits Prometheus to this port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: core-etcd
  namespace: monitoring
  labels:
    app.kubernetes.io/name: core-etcd
    app.kubernetes.io/part-of: kamiwaza
spec:
  namespaceSelector:
    matchNames:
      - kamiwaza
  selector:
    matchLabels:
      app.kubernetes.io/name: core-etcd
  endpoints:
    - port: etcd-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
