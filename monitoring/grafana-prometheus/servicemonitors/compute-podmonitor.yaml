# Per-pod scrape of the platform's delegated-compute workloads.
#
# A ServiceMonitor cannot express this: the operator publishes only the head's
# gcs, transport, and dashboard ports, so no Service carries the metrics port.
# The head and worker Pods both declare container port 8080 named `metrics`,
# which is what a PodMonitor selects directly.
#
# `scrape-networkpolicies.yaml` admits Prometheus to this port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: core-delegated-compute
  namespace: monitoring
  labels:
    app.kubernetes.io/name: core-raycluster
    app.kubernetes.io/part-of: kamiwaza
spec:
  namespaceSelector:
    matchNames:
      - kamiwaza
  selector:
    matchLabels:
      app.kubernetes.io/name: core-raycluster
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
