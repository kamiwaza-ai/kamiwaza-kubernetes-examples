# Helm values for Grafana Alloy (DaemonSet log collector).
#
# Install (after Loki is running):
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install alloy grafana/alloy \
#     -n monitoring --create-namespace -f alloy-values.yaml

alloy:
  mounts:
    varlog: true
  configMap:
    create: true
    content: |
      // ------------------------------------------------------------------
      // Pod log collection
      // ------------------------------------------------------------------
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Pending|Succeeded|Failed|Completed"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_uid",
            "__meta_kubernetes_pod_container_name",
          ]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
        sync_period  = "5s"
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.parse_cri.receiver]
      }

      loki.process "parse_cri" {
        stage.cri {}
        stage.static_labels {
          values = {
            cluster = "kamiwaza",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // ------------------------------------------------------------------
      // Kubernetes cluster events
      // ------------------------------------------------------------------
      loki.source.kubernetes_events "cluster_events" {
        log_format = "logfmt"
        forward_to = [loki.process.events_labels.receiver]
      }

      loki.process "events_labels" {
        stage.static_labels {
          values = {
            cluster = "kamiwaza",
            job     = "integrations/kubernetes/eventhandler",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // ------------------------------------------------------------------
      // Loki write endpoint
      // ------------------------------------------------------------------
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset

serviceMonitor:
  enabled: true

rbac:
  create: true

serviceAccount:
  create: true
